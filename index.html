/**
 * حذف التشريع أو المادة لا يمحو ما كُتب عندهما؛ الحاشية ملك صاحبها لا ملك
 * النص. فتُفكّ عن مادتها ويُحفظ أثرها لتبقى مفهومة، وتُنسب إلى التشريع إن بقي.
 */
function detachNote(note, law, article, nextLawId) {
  if (!note.orphan) {
    note.orphan = {
      lawTitle:     law ? law.title : '',
      articleNo:    article ? article.no : '',
      articleTitle: article ? (article.title || '') : '',
    };
  }
  note.articleId = null;
  note.lawId = nextLawId || null;
}

const Actions = {
  'open-laws':    () => Router.go('laws'),
  'open-law':     el => Router.go('law', el.dataset.id),
  'open-article': el => { if (el.dataset.id) { State.editingNoteId = null; Router.go('article', el.dataset.id); } },
  'new-law':      () => Sheet.law(null),
  'edit-law':     el => Sheet.law(el.dataset.id),
  'new-article':  el => Sheet.article(null, el.dataset.id),
  'edit-article': el => Sheet.article(el.dataset.id),
  'close-sheet':  () => Sheet.close(),
  'clear-date':   el => DatePick.clear(el.dataset.id),
  'cancel-edit':  () => { State.editingNoteId = null; render(); },

  'new-article-current': () => Sheet.article(null, Router.current.id),

  'filter-type': el => {
    State.noteTypeFilter = el.dataset.type;
    if (Router.current.view === 'notes') render(); else Router.go('notes');
  },

  'filter-topic': el => {
    const topic = el.dataset.topic;
    State.topicFilter = State.topicFilter === topic ? null : topic;
    if (Router.current.view === 'notes') render(); else Router.go('notes');
  },

  'edit-note': el => {
    const note = Model.note(el.dataset.id);
    if (!note) return;
    State.editingNoteId = note.id;
    State.composing = false;
    render();
    setTimeout(() => {
      const box = $(`[data-note="${CSS.escape(note.id)}"] textarea`);
      if (!box) return;
      box.focus();
      box.setSelectionRange(box.value.length, box.value.length);
      box.scrollIntoView({ block: 'center' });
    }, 0);
  },

  'open-note': el => {
    const note = Model.note(el.dataset.id);
    if (!note) return;
    if (note.articleId) { State.editingNoteId = null; Router.go('article', note.articleId); return; }
    State.topicFilter = null;
    State.query = '';
    Router.go('notes');
  },

  'toggle-compose': () => {
    State.composing = !State.composing;
    State.editingNoteId = null;
    if (Router.current.view === 'notes') render(); else Router.go('notes');
    if (State.composing) setTimeout(() => $('.compose-block .note-input')?.focus(), 0);
  },

  'save-note': el => {
    const composer = el.closest('[data-composer]');
    if (composer) Compose.save(composer);
  },

  'save-law': el => {
    const title = $('#lf-title').value.trim();
    if (!title) { toast('اسم التشريع مطلوب'); return; }
    const payload = {
      title,
      kind:        $('#lf-kind').value,
      status:      $('#lf-status').value,
      instrument:  $('#lf-instrument').value.trim(),
      issuedAt:    DatePick.read('lf-issued'),
      publishedAt: DatePick.read('lf-published'),
      effectiveAt: DatePick.readEffective(),
      gazette:     $('#lf-gazette').value.trim(),
      authority:   $('#lf-authority').value.trim(),
      summary:     $('#lf-summary').value.trim(),
      preamble:    $('#lf-preamble').value.trim(),
    };
    if (el.dataset.id) {
      const existing = Model.law(el.dataset.id);
      if (!existing) { toast('لم يُعثر على التشريع'); return; }
      Object.assign(existing, payload);
      toast('حُفظت البيانات');
    } else {
      const law = { id: uid('law'), ...payload };
      Store.data.laws.push(law);
      Store.commit();
      Sheet.close();
      Router.go('law', law.id);
      toast('أُضيف التشريع');
      return;
    }
    Store.commit();
    Sheet.close();
    render();
  },

  'delete-law': el => {
    const law = Model.law(el.dataset.id);
    if (!law) return;
    const articleIds = new Set(Model.articlesOfLaw(law.id).map(a => a.id));
    const kept = Store.data.notes.filter(n =>
      (n.articleId && articleIds.has(n.articleId)) || (!n.articleId && n.lawId === law.id));
    const message = `حذف «${law.title}» سيحذف ${articleIds.size} مادة.`
      + (kept.length ? ` وتبقى ${kept.length} حاشية في دفترك بنصّها ومواضيعها، دون مادة.` : '')
      + ' لا يمكن التراجع.';
    if (!confirm(message)) return;
    if (law.bundled) Store.markDropped(law.id);
    for (const note of kept) detachNote(note, law, Model.article(note.articleId), null);
    Store.data.articles = Store.data.articles.filter(a => a.lawId !== law.id);
    Store.data.laws     = Store.data.laws.filter(l => l.id !== law.id);
    Store.commit();
    Sheet.close();
    Router.go('laws');
    render();
    toast(kept.length ? 'حُذف التشريع وبقيت حواشيه' : 'حُذف التشريع');
  },

  'save-article': el => {
    const no   = $('#af-no').value.trim();
    const text = $('#af-text').value.trim();
    if (!no)   { toast('رقم المادة مطلوب'); return; }
    if (!text) { toast('نص المادة مطلوب'); return; }
    const payload = {
      lawId:   $('#af-law').value,
      no,
      title:   $('#af-title').value.trim(),
      part:    $('#af-part').value.trim(),
      chapter: $('#af-chapter').value.trim(),
      branch:  $('#af-branch').value.trim(),
      text,
    };
    if (el.dataset.id) {
      const existing = Model.article(el.dataset.id);
      if (!existing) { toast('لم يُعثر على المادة'); return; }
      Object.assign(existing, payload);
      Store.commit();
      Sheet.close();
      render();
      toast('حُفظت المادة');
    } else {
      const article = { id: uid('art'), ...payload };
      Store.data.articles.push(article);
      Store.commit();
      Sheet.close();
      Router.go('article', article.id);
      toast('أُضيفت المادة');
    }
  },

  'delete-article': el => {
    const article = Model.article(el.dataset.id);
    if (!article) return;
    const lawId = article.lawId;
    const law = Model.law(lawId);
    const kept = Model.notesOfArticle(article.id);
    const message = `حذف المادة ${article.no}.`
      + (kept.length ? ` وتبقى ${kept.length} حاشية في دفترك منسوبةً إلى التشريع، دون مادة.` : '')
      + ' لا يمكن التراجع.';
    if (!confirm(message)) return;
    for (const note of kept) detachNote(note, law, article, lawId);
    Store.data.articles = Store.data.articles.filter(a => a.id !== article.id);
    Store.commit();
    Sheet.close();
    Router.go('law', lawId);
    toast(kept.length ? 'حُذفت المادة وبقيت حواشيها' : 'حُذفت المادة');
  },

  'delete-note': el => {
    if (!confirm('حذف هذه الحاشية؟ لا يمكن التراجع.')) return;
    Store.data.notes = Store.data.notes.filter(n => n.id !== el.dataset.id);
    State.editingNoteId = null;
    Store.commit();
    render();
    toast('حُذفت الحاشية');
  },

  export: () => {
    Store.flush();
    const blob = new Blob([JSON.stringify(Store.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `hashiya-${new Date().toISOString().slice(0, 10)}.json`;
    link.click();
    URL.revokeObjectURL(url);
  },

  import: () => $('#file-input').click(),
};

function bindEvents() {
  // منع فقدان التركيز عند النقر على اقتراح — يبقى المؤشر في مربع الكتابة.
  document.addEventListener('mousedown', event => {
    if (event.target.closest('.ac')) event.preventDefault();
  });

  // نقر مفوَّض على كامل الصفحة.
  document.addEventListener('click', event => {
    if (event.target === $('#modal')) { Sheet.close(); return; }

    // اختيار عنصر من قائمة الاقتراحات — قد يكون في الصفحة أكثر من محرِّر.
    const option = event.target.closest('.ac li');
    if (option) {
      const textarea = option.closest('[data-composer]')?.querySelector('textarea');
      if (textarea) Compose.acceptAt(textarea, Number(option.dataset.i));
      return;
    }

    const trigger = event.target.closest('[data-action]');
    if (!trigger || trigger.disabled) return;
    const handler = Actions[trigger.dataset.action];
    if (handler) { event.preventDefault(); handler(trigger); }
  });

  // اختيار مصدر أو موضوع رئيسي، أو طلب إضافة قيمة جديدة.
  document.addEventListener('change', event => {
    if (event.target.matches('.note-source, .note-topic')) {
      Compose.onPickChange(event.target);
      return;
    }

    // تبديل وجه تاريخ السريان: تاريخ محدد أو مدة.
    if (event.target.id === 'lf-eff-mode') {
      for (const block of $$('[data-eff]')) block.hidden = block.dataset.eff !== event.target.value;
      return;
    }
    // أي تغيير داخل أداة تاريخ يعيد بناء أيام الشهر ويحدّث سطر البيان.
    const picker = event.target.closest('[data-date]');
    if (picker) DatePick.refresh(picker.dataset.date);
  });

  // الكتابة في مربع الحاشية أو حقل البحث.
  document.addEventListener('input', event => {
    if (event.target.matches('.note-input')) {
      Compose.openAutocomplete(event.target);
      return;
    }
    if (event.target.id === 'notes-search') {
      State.query = event.target.value;
      const caret = event.target.selectionStart;
      render();
      const field = $('#notes-search');
      if (field) { field.focus(); field.setSelectionRange(caret, caret); }
    }
  });

  document.addEventListener('keydown', event => {
    if (event.target.matches('.note-input')) { Compose.onKeyDown(event, event.target); return; }
    if (event.key === 'Escape' && !$('#modal').hidden) Sheet.close();
  });

  // إغلاق قائمة الاقتراحات عند مغادرة مربع الكتابة.
  document.addEventListener('focusout', event => {
    if (event.target.matches('.note-input')) {
      setTimeout(() => {
        if (document.activeElement?.closest('.ac')) return;
        Compose.closeAutocomplete();
      }, 120);
    }
  });

  // استيراد نسخة احتياطية.
  $('#file-input').addEventListener('change', event => {
    const file = event.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        Store.replaceAll(JSON.parse(String(reader.result)));
        State.topicFilter = null;
        State.query = '';
        State.editingNoteId = null;
        State.composing = false;
        Router.go('home');
        render();
        toast('استُورد الملف');
      } catch (err) {
        toast('الملف غير صالح');
        console.error('حاشية: فشل الاستيراد.', err);
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  });
}

  ["ith_9", "٩", "الباب الأول — أحكام عامة", "", "", "1- للمحكمة أن تعدل عما أمرت به من إجراءات الإثبات، بشرط أن تبيّن أسباب العدول في محضر الجلسة.\n2- للمحكمة ألا تأخذ بنتيجة إجراء الإثبات، بشرط أن تبيّن أسباب ذلك في حكمها."],
  ["ith_10", "١٠", "الباب الأول — أحكام عامة", "", "", "يكون لأي إجراء من إجراءات الإثبات اتخذ إلكترونياً الأحكام المقررة في هذا النظام."],
  ["ith_11", "١١", "الباب الأول — أحكام عامة", "", "", "1- تكون إجراءات الإثبات من إقرار أو استجواب أو أداء للشهادة أو اليمين أمام المحكمة، فإن تعذر فللمحكمة أن تنتقل أو تكلف أحد قضاتها بذلك.\n2- إذا كان المقر أو المستجوب أو الشاهد أو من وجهت إليه اليمين ونحوهم مقيماً خارج نطاق اختصاص المحكمة، وتعذر إجراء الإثبات إلكترونياً؛ فعلى المحكمة أن تستخلف محكمة مكان إقامته. وفي هذه الحالة يبلغ قرار الاستخلاف للمحكمة المستخلَفة."],
  ["ith_12", "١٢", "الباب الأول — أحكام عامة", "", "", "يكون إقرار الأخرس ومن في حكمه واستجوابه وأداؤه للشهادة واليمين وتوجيهها والنكول عنها وردها بالكتابة، فإن لم يكن يعرف الكتابة فبإشارته المعهودة."],
  ["ith_13", "١٣", "الباب الأول — أحكام عامة", "", "", "دون إخلال بالتزامات المملكة في الاتفاقيات الدولية التي تكون طرفاً فيها، للمحكمة أن تأخذ بإجراءات الإثبات التي جرت خارج المملكة؛ ما لم تخالف النظام العام."],
  ["ith_14", "١٤", "الباب الثاني — الإقرار واستجواب الخصوم", "الفصل الأول — الإقرار", "", "1- يكون الإقرار قضائياً إذا اعترف الخصم أمام المحكمة بواقعة مدعى بها عليه، وذلك أثناء السير في دعوى متعلقة بهذه الواقعة.\n2- يكون الإقرار غير قضائي إذا لم يقع أمام المحكمة، أو كان أثناء السير في دعوى أخرى."],
  ["ith_15", "١٥", "الباب الثاني — الإقرار واستجواب الخصوم", "الفصل الأول — الإقرار", "", "1- يشترط أن يكون المقر أهلاً للتصرف فيما أقر به.\n2- يصح إقرار الصغير المميز المأذون له في البيع والشراء بقدر ما أذن له فيه.\n3- يصح الإقرار من الوصي أو الولي أو ناظر الوقف أو من في حكمهم فيما باشروه في حدود ولايتهم."],
  ["ith_16", "١٦", "الباب الثاني — الإقرار واستجواب الخصوم", "الفصل الأول — الإقرار", "", "1- يكون الإقرار صراحة أو دلالة، باللفظ أو بالكتابة.\n2- لا يقبل الإقرار إذا كذبه ظاهر الحال."],
  ["ith_17", "١٧", "الباب الثاني — الإقرار واستجواب الخصوم", "الفصل الأول — الإقرار", "", "الإقرار القضائي حجة قاطعة على المقر، وقاصرة عليه."],
  ["ith_18", "١٨", "الباب الثاني — الإقرار واستجواب الخصوم", "الفصل الأول — الإقرار", "", "1- يلزم المقر بإقراره، ولا يقبل رجوعه عنه.\n2- لا يتجزأ الإقرار على صاحبه، إلا إذا انصب على وقائع متعددة، وكان وجود واقعة منها لا يستلزم حتماً وجود الوقائع الأخرى."],
  ["ith_19", "١٩", "الباب الثاني — الإقرار واستجواب الخصوم", "الفصل الأول — الإقرار", "", "يكون إثبات الإقرار غير القضائي وفق الأحكام المقررة في هذا النظام، بما في ذلك عدم جواز إثباته بالشهادة إلا في الأحوال التي يجوز فيها الإثبات بالشهادة."],
  ["ith_20", "٢٠", "الباب الثاني — الإقرار واستجواب الخصوم", "الفصل الثاني — استجواب الخصوم", "", "1- للمحكمة -من تلقاء نفسها أو بناءً على طلب أحد الخصوم- أن تستجوب من يكون حاضراً من الخصوم.\n2- لأي من الخصوم استجواب خصمه مباشرة."],
  ["ith_21", "٢١", "الباب الثاني — الإقرار واستجواب الخصوم", "الفصل الثاني — استجواب الخصوم", "", "1- للمحكمة -من تلقاء نفسها أو بناءً على طلب أحد الخصوم- أن تأمر بحضور الخصم لاستجوابه، ويجب على من تقرر استجوابه أن يحضر الجلسة المحددة لذلك.\n2- إذا تخلف الخصم عن الحضور للاستجواب بغير عذر مقبول، أو امتنع عن الإجابة بغير مسوّغ معتبر، استخلصت المحكمة ما تراه من ذلك، وجاز لها أن تقبل الإثبات بشهادة الشهود والقرائن في الأحوال التي لا يجوز فيها ذلك.\n3- يسري حكم الفقرة (2) من هذه المادة على من تخلف عن الحضور في الدعوى أو امتنع عن الإجابة عنها."],
  ["ith_22", "٢٢", "الباب الثاني — الإقرار واستجواب الخصوم", "الفصل الثاني — استجواب الخصوم", "", "إذا كان الخصم عديم الأهلية أو ناقصها فيستجوب من ينوب عنه، ويجوز للمحكمة مناقشته هو إن كان مميزاً في الأمور المأذون له فيها، ويكون استجواب الشخص ذي الصفة الاعتبارية عن طريق من يمثله نظاماً. وفي جميع الأحوال يشترط أن يكون المراد استجوابه أهلاً للتصرف في الحق المتنازع فيه."],
  ["ith_23", "٢٣", "الباب الثاني — الإقرار واستجواب الخصوم", "الفصل الثاني — استجواب الخصوم", "", "1- تكون الإجابة في الجلسة نفسها إلا إذا رأت المحكمة إعطاء موعد للإجابة.\n2- تكون الإجابة في مواجهة من طلب الاستجواب، ولا يتوقف الاستجواب على حضوره."],
  ["ith_24", "٢٤", "الباب الثاني — الإقرار واستجواب الخصوم", "الفصل الثاني — استجواب الخصوم", "", "1- للخصم الاعتراض على سؤال وجِّه إليه، وعليه أن يبين وجه اعتراضه.\n2- على المحكمة منع كل سؤال غير متعلق بالدعوى أو غير منتج فيها أو غير جائز قبوله."],
  ["ith_25", "٢٥", "الباب الثالث — الكتابة", "الفصل الأول — المحرَّرات الرسمية", "", "1- المحرَّر الرسمي هو الذي يثبت فيه موظف عام أو شخص مكلف بخدمة عامة، ما تم على يديه أو ما تلقاه من ذوي الشأن، طبقاً للأوضاع النظامية، وفي حدود سلطته واختصاصه.\n2- إذا لم يستوف المحرَّر الشروط الواردة في الفقرة (1) من هذه المادة فتكون له حجية المحرَّر العادي؛ متى كان ذوو الشأن قد وقعوه."],
  ["ith_26", "٢٦", "الباب الثالث — الكتابة", "الفصل الأول — المحرَّرات الرسمية", "", "1- المحرَّر الرسمي حجة على الكافة بما دوّن فيه من أمور قام بها محرره في حدود مهمته، أو حدثت من ذوي الشأن في حضوره؛ ما لم يثبت تزويره بالطرق المقررة نظاماً.\n2- يكون مضمون ما ذكره أي من ذوي الشأن في المحرَّر الرسمي حجة عليه؛ ما لم يثبت غير ذلك."],
  ["ith_27", "٢٧", "الباب الثالث — الكتابة", "الفصل الأول — المحرَّرات الرسمية", "", "1- إذا كان أصل المحرَّر الرسمي موجوداً، فإن صورته الرسمية تعد حجة بالقدر الذي تكون فيه مطابقة للأصل.\n2- تكون الصورة رسمية إذا أخذت من الأصل؛ وفقاً للإجراءات المنظمة لذلك.\n3- تعد الصورة الرسمية مطابقة للأصل؛ ما لم ينازع في ذلك أي من ذوي الشأن، فيجب مطابقتها للأصل."],
  ["ith_28", "٢٨", "الباب الثالث — الكتابة", "الفصل الأول — المحرَّرات الرسمية", "", "إذا لم يوجد أصل المحرَّر الرسمي فتكون للصورة الرسمية حجية الأصل؛ متى كان مظهرها الخارجي لا يسمح بالشك في مطابقتها للأصل، وما عدا ذلك من الصور فلا يعتد بها إلا لمجرد الاستئناس."],
  ["ith_29", "٢٩", "الباب الثالث — الكتابة", "الفصل الثاني — المحرَّرات العادية", "", "1- يعد المحرَّر العادي صادراً ممن وقعه وحجة عليه؛ ما لم ينكر صراحة ما هو منسوب إليه من خط أو إمضاء أو ختم أو بصمة، أو ينكر ذلك خلَفُه أو ينفي علمه بأن الخط أو الإمضاء أو الختم أو البصمة هي لمن تلقى عنه الحق.\n2- من احتج عليه بمحرَّر عادي وناقش موضوعه أمام المحكمة فلا يقبل منه أن ينكر بعد ذلك صحته، أو أن يتمسك بعدم علمه بأنه صدر ممن تلقى عنه الحق."],
  ["ith_30", "٣٠", "الباب الثالث — الكتابة", "الفصل الثاني — المحرَّرات العادية", "", "تكون للمراسلات الموقع عليها أو الثابت نسبتها إلى مرسلها؛ حجية المحرَّر العادي في الإثبات، ما لم يثبت المرسل أنه لم يرسل الرسالة ولم يكلف أحداً بإرسالها."],
  ["ith_31", "٣١", "الباب الثالث — الكتابة", "الفصل الثاني — المحرَّرات العادية", "", "1- لا تكون دفاتر التجار حجة على غير التجار، ومع ذلك فإن البيانات المثبتة فيها تصلح أساساً يجيز للمحكمة أن توجه اليمين المتممة لمن قوي جانبه من الطرفين، وذلك فيما يجوز إثباته بشهادة الشهود.\n2- تكون دفاتر التجار الإلزامية المنتظمة حجة لصاحبها التاجر ضد خصمه التاجر. وتسقط هذه الحجية بإثبات عكس ما ورد فيها بكافة طرق الإثبات، بما في ذلك دفاتر الخصم المنتظمة.\n3- تكون دفاتر التجار الإلزامية -منتظمة كانت أو غير منتظمة- حجة على صاحبها التاجر فيما استند إليه خصمه التاجر أو غير التاجر؛ وفي هذه الحالة تعد القيود التي في مصلحة صاحب الدفاتر حجة له أيضاً.\n4- إذا استند أحد الخصمين التاجرين إلى دفاتر خصمه وسلم مقدماً بما ورد فيها وامتنع الخصم دون مسوّغ عن إبراز دفاتره أو التمكين من الاطلاع عليها؛ جاز للمحكمة توجيه اليمين المتممة لمن استند إلى الدفاتر على صحة دعواه."],
  ["ith_32", "٣٢", "الباب الثالث — الكتابة", "الفصل الثاني — المحرَّرات العادية", "", "لا تكون الدفاتر والأوراق الخاصة -ولو دونت رقمياً- حجة على من صدرت منه إلا في الحالتين الآتيتين:\n1- إذا أورد فيها صراحة أنه استوفى دينه.\n2- إذا أورد فيها صراحة أنه قصد بما دونه أن يقوم مقام السند لمن أثبت حقاً لمصلحته.\nوفي الحالتين إذا كان ما ورد من ذلك غير موقع ممن صدر عنه جاز له إثبات عكسه بكافة طرق الإثبات."],
  ["ith_33", "٣٣", "الباب الثالث — الكتابة", "الفصل الثاني — المحرَّرات العادية", "", "1- تأشير الدائن على سند الدين بخطه دون توقيع منه بما يفيد براءة ذمة المدين يعد حجة على الدائن إلى أن يثبت العكس، ويكون التأشير على السند بمثل ذلك حجة على الدائن أيضاً ولو لم يكن بخطه ولا موقعاً منه؛ ما دام السند لم يخرج قط من حيازته.\n2- يسري حكم الفقرة (1) من هذه المادة إذا أثبت الدائن بخطه دون توقيع منه ما يفيد براءة ذمة المدين في نسخة أصلية أخرى لسند أو مخالصة، وكانت النسخة أو المخالصة في يد المدين."],
  ["ith_34", "٣٤", "الباب الثالث — الكتابة", "الفصل الثالث — طلب إلزام الخصم بتقديم المحرَّرات الموجودة تحت يده", "", "1- يجوز للخصم أن يطلب من المحكمة إلزام خصمه بتقديم أي محرَّر منتج في الدعوى يكون تحت يده في الحالات الآتية:\nأ- إذا كان النظام يجيز مطالبته بتقديمه أو تسليمه.\nب- إذا كان المحرَّر مشتركاً بينه وبين خصمه، ويعد المحرَّر مشتركاً على الأخص إذا كان لمصلحة الخصمين، أو كان مثبتاً لالتزاماتهما وحقوقهما المتبادلة.\nج- إذا استند إليه خصمه في أي مرحلة من مراحل الدعوى.\n2- لا يقبل الطلب المشار إليه في الفقرة (1) من هذه المادة؛ ما لم يستوف العناصر الآتية:\nأ- أوصاف المحرَّر، ومضمونه بقدر ما يمكن من التفصيل.\nب- الدلائل والظروف التي تؤيد أن المحرَّر تحت يد الخصم.\nج- الواقعة التي يستدل بالمحرَّر عليها، ووجه إلزام الخصم بتقديمه."],
  ["ith_35", "٣٥", "الباب الثالث — الكتابة", "الفصل الثالث — طلب إلزام الخصم بتقديم المحرَّرات الموجودة تحت يده", "", "1- إذا أقر الخصم أن المحرَّر في حوزته أو سكت، أو أثبت الطالب صحة طلبه، أمرت المحكمة بتقديم المحرَّر.\n2- إذا امتنع الخصم عن تقديم المحرَّر المطلوب بعد إمهاله مرة واحدة، عدت صورة المحرَّر التي قدمها الطالب صحيحة مطابقة لأصلها، فإن لم يكن قد قدم صورة من المحرَّر؛ فللمحكمة الأخذ بقول الطالب فيما يتعلق بشكل المحرَّر ومضمونه.\n3- إذا أنكر الخصم وجود المحرَّر ولم يقدم الطالب للمحكمة إثباتاً كافياً لصحة طلبه، فله أن يطلب من المحكمة توجيه اليمين لخصمه فيما يتعلق بهذا المحرَّر، وفقاً للأحكام المقررة في الباب (الثامن) من هذا النظام، وإذا نكل الخصم عن اليمين ولم يردها على الطالب أو رد اليمين على الطالب فحلف، عدت صورة المحرَّر التي قدمها الطالب صحيحة مطابقة لأصلها، فإن لم يكن قد قدم صورة من المحرَّر؛ فللمحكمة الأخذ بقول الطالب فيما يتعلق بشكل المحرَّر ومضمونه."],
  ["ith_36", "٣٦", "الباب الثالث — الكتابة", "الفصل الثالث — طلب إلزام الخصم بتقديم المحرَّرات الموجودة تحت يده", "", "1- للخصم في الدعاوى التجارية أن يطلب من خصمه تقديم محرَّر ذي صلة بالدعوى أو الاطلاع عليه، وتأمر المحكمة بذلك وفق الضوابط الآتية:\nأ- أن يكون المحرَّر محدداً بذاته أو نوعه.\nب- أن يكون للمحرَّر علاقة بالتعامل التجاري محل الدعوى، أو يؤدي إلى إظهار الحقيقة فيه.\nج- ألّا يكون له طابع السرية بنص خاص أو اتفاق بين الخصوم، أو ألا يكون من شأن الاطلاع عليه انتهاك أي حق في السر التجاري أو أي حقوق متصلة به.\n2- إذا امتنع الخصم عن تقديم ما أمرت المحكمة بتقديمه إلى خصمه وفق أحكام الفقرة (1) من هذه المادة؛ فللمحكمة أن تعد امتناعه قرينة."],
  ["ith_37", "٣٧", "الباب الثالث — الكتابة", "الفصل الثالث — طلب إلزام الخصم بتقديم المحرَّرات الموجودة تحت يده", "", "مع مراعاة الأحكام المنصوص عليها في المواد السابقة، يجوز للمحكمة من تلقاء نفسها، أو بناءً على طلب أحد الخصوم، وفي أي مرحلة تكون عليها الدعوى، أن تقرر الآتي:\n1- إدخال الغير لإلزامه بتقديم محرَّر تحت يده.\n2- طلب محرَّر من جهة عامة أو صورة مصدقة منه بما يفيد مطابقته لأصله إذا تعذر ذلك على الخصم، وللمحكمة أن تطلب من الجهة العامة أن تقدم -كتابة أو شفاهاً- ما لديها من معلومات ذات صلة بالدعوى، دون إخلال بالأنظمة."],
  ["ith_38", "٣٨", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الأول — أحكام عامة", "1- للمحكمة أن تقدر ما يترتب على العيوب المادية في المحرَّر من إسقاط حجيته في الإثبات أو إنقاصها، ولها أن تأخذ بكل ما تضمنه المحرَّر أو ببعضه.\n2- إذا كانت صحة المحرَّر محل شك في نظر المحكمة، فلها أن تسأل من صدر عنه، أو تدعو الشخص الذي حرَّره ليبدي ما يوضح حقيقة الأمر فيه."],
  ["ith_39", "٣٩", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الأول — أحكام عامة", "1- يرد الادعاء بالتزوير على المحرَّر الرسمي والعادي، أما إنكار الخط أو الختم أو الإمضاء أو البصمة فلا يرد إلا على المحرَّر العادي.\n2- على الخصم الذي يدعي التزوير عبء إثبات ادعائه، أما من ينكر صدور المحرَّر العادي منه أو ينكر ذلك خلفه أو نائبه أو ينفي علمه به، فيقع على خصمه عبء إثبات صدوره منه أو من سلفه.\n3- إذا أقر الخصم بصحة الختم الموقع به على المحرَّر العادي ونفى أنه ختم به، تعين عليه اتخاذ طريق الادعاء بالتزوير."],
  ["ith_40", "٤٠", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الثاني — إنكار الخط أو الإمضاء أو الختم أو البصمة، وتحقيق الخطوط", "إذا أنكر من احتج عليه بالمحرَّر العادي خطه أو إمضاءه أو ختمه أو بصمته، أو أنكر ذلك خلفه أو نائبه أو نفى علمه به، وظل الخصم الآخر متمسكاً بالمحرَّر، وكان المحرَّر منتِجًا في النزاع، ولم تكف وقائع الدعوى ومستنداتها في إقناع المحكمة بصحة الخط أو الإمضاء أو الختم أو البصمة؛ فتأمر المحكمة بالتحقيق بالمضاهاة، أو بسماع الشهود أو بكليهما، وفقاً للقواعد والإجراءات المنصوص عليها في هذا النظام. ولا تسمع الشهادة إلا فيما يتعلق بإثبات حصول الكتابة أو الإمضاء أو الختم أو البصمة على المحرَّر."],
  ["ith_41", "٤١", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الثاني — إنكار الخط أو الإمضاء أو الختم أو البصمة، وتحقيق الخطوط", "1- تحدد المحكمة جلسة لحضور الخصوم لتقديم ما لديهم من محرَّرات للمضاهاة، والاتفاق على ما يصلح منها لذلك، فإن تخلف الخصم المكلف بالإثبات بغير عذر مقبول جاز الحكم بإسقاط حقه في الإثبات، وإذا تخلف خصمه جاز للمحكمة اعتبار المحرَّرات المقدمة للمضاهاة صالحة لها.\n2- يجب على الخصم الذي ينازع في صحة المحرَّر أن يحضر بنفسه للاستكتاب في الموعد المحدد لذلك، فإن امتنع عن الحضور بغير عذر مقبول، أو حضر وامتنع عن الاستكتاب؛ جاز للمحكمة الحكم بصحة المحرَّر."],
  ["ith_42", "٤٢", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الثاني — إنكار الخط أو الإمضاء أو الختم أو البصمة، وتحقيق الخطوط", "1- في حالة عدم اتفاق الخصوم على المحرَّرات الصالحة للمضاهاة، فلا يقبل إلا ما يأتي:\nأ- الخط أو الإمضاء أو الختم أو البصمة الموضوعة على محرَّرات رسمية.\nب- الجزء الذي يعترف الخصم بصحته من المحرَّر محل التحقيق.\nج- خط الخصم أو إمضاؤه الذي يكتبه أمام المحكمة أو البصمة التي يبصمها أمامها.\nد- الخط أو الإمضـاء أو الختـم أو البصمـة الموضـوعة على محـرَّرات عـادية ثبتت نسبتها إلى الخصم.\n2- تكون مضاهاة ما تم إنكاره من الخط أو الإمضاء أو الختم أو البصمة على ما هو ثابت لمن يشهد عليه المحرَّر محل التحقيق من خط أو إمضاء أو ختم أو بصمة."],
  ["ith_43", "٤٣", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الثاني — إنكار الخط أو الإمضاء أو الختم أو البصمة، وتحقيق الخطوط", "1- إذا حكم بصحة المحرَّر كله فيحكم على من أنكره بغرامة لا تزيد على (عشرة آلاف) ريال، وذلك دون إخلال بحق ذوي الشأن في المطالبة بالتعويض.\n2- لا تتعدد الغرامة بتعدد الخلف أو النائب، ولا يحكم بالغرامة على أي منهما إذا اقتصر إنكاره على نفي العلم."],
  ["ith_44", "٤٤", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الثالث — الادعاء بالتزوير", "1- يكون الادعاء بالتزوير في أي حالة تكون عليها الدعوى، ويحدد المدعي بالتزوير كل مواضع التزوير المدعى به، وشواهده، وإجراءات التحقيق التي يطلب إثباته بها، ويكون ذلك بمذكرة يقدمها للمحكمة أو بإثباته في محضر الجلسة.\n2- إذا كان الادعاء بالتزوير منتجاً في النزاع ولم تكف وقائع الدعوى ومستنداتها لإقناع المحكمة بصحة المحرَّر أو بتزويره، ورأت أن إجراء التحقيق الذي طلبه المدعي بالتزوير منتج وجائز؛ أمرت به.\n3- يكون الأمر بالتحقيق في الادعاء بالتزوير بالمضاهاة أو بسماع الشهود أو بكليهما، وفقاً للقواعد والإجراءات المنصوص عليها في هذا الباب."],
  ["ith_45", "٤٥", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الثالث — الادعاء بالتزوير", "1‌- على مدعي التزوير أن يسلم المحكمة المحرَّر المدعى تزويره إن كان تحت يده أو صورته المبلغة إليه، وإذا امتنع عن تسليم المحرَّر أو صورته -بحسب الأحوال- سقط حقه في الادعاء بتزويره، ولا يقبل منه هذا الادعاء بعد ذلك.\n2- إذا كان المحرَّر تحت يد الخصم فللمحكمة أن تكلفه بتسليمه إلى المحكمة، أو تأمر بضبطه وإيداعه، وإذا امتنع الخصم عن تسليم المحرَّر وتعذر على المحكمة ضبطه عُد غير موجود، ولا يمنع ذلك من ضبطه -إن أمكن- فيما بعد."],
  ["ith_46", "٤٦", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الثالث — الادعاء بالتزوير", "1- يجوز لمن يدعي تزوير المحرَّر أن يتنازل عن ادعائه قبل انتهاء إجراءات التحقيق، ولا يقبل منه ادعاء تزوير المحرَّر بعد تنازله.\n2- يجوز للمدعى عليه بالتزوير إنهاء إجراءات التحقيق في التزوير -في أي حالة كانت عليه- بنزوله عن التمسك بالمحرَّر المدعى تزويره، وللمحكمة في هذه الحالة أن تأمر بضبط المحرَّر أو حفظه إذا طلب المدعي بالتزوير ذلك لمصلحة مشروعة."],
  ["ith_47", "٤٧", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الثالث — الادعاء بالتزوير", "الأمر بالتحقيق في ادعاء التزوير يوقف صلاحية المحرَّر المدعى تزويره للتنفيذ، وذلك دون إخلال بالإجراءات التحفظية."],
  ["ith_48", "٤٨", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الثالث — الادعاء بالتزوير", "يجوز للمحكمة -ولو لم يُدَّعَ أمامها بالتزوير- أن تحكم برد أي محرَّر وبطلانه إذا ظهر لها بجلاء من حالته أو من ظروف الدعوى أنه مزور، ويجب عليها في هذه الحالة أن تبين في حكمها الظروف والقرائن التي تبينت منها ذلك."],
  ["ith_49", "٤٩", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الثالث — الادعاء بالتزوير", "1- إذا حكم برفض الادعاء بتزوير المحرَّر أو سقوط حق مدعي التزوير في الإثبات، حكم عليه بغرامة لا تزيد على (عشرة آلاف) ريال، وذلك دون إخلال بحق ذوي الشأن في المطالبة بالتعويض.\n2- لا يحكم بالغرامة على مدعي التزوير إذا تنازل عن ادعائه قبل انتهاء إجراءات التحقيق فيه؛ ما لم يثبت للمحكمة أنه قصد الكيد لخصمه أو تأخير الفصل في الدعوى.\n3- لا يحكم بالغرامة على مدعي التزوير إذا ثبت بعض ما ادعاه.\n4- إذا ثبت تزوير المحرَّر أحالته المحكمة إلى النيابة العامة؛ لاتخاذ الإجراءات اللازمة."],
  ["ith_50", "٥٠", "الباب الثالث — الكتابة", "الفصل الرابع — إثبات صحة المحرَّرات", "الفرع الرابع — دعوى التزوير الأصلية", "يجوز لمن يخشى الاحتجاج عليه بمحرَّر مزور أن يخاصم من بيده هذا المحرَّر ومن يفيد منه، وفقاً للإجراءات المنظمة لرفع الدعوى. وتراعي المحكمة في تحقيق هذه الدعوى القواعد والإجراءات المنصوص عليها في هذا الباب."],
  ["ith_51", "٥١", "الباب الثالث — الكتابة", "الفصل الخامس — أحكام ختامية في الكتابة", "", "1- يجوز في الأحوال التي يجب فيها الإثبات بالكتابة أن يحل محلها الإقرار القضائي، أو اليمين الحاسمة، أو مبدأ الثبوت بالكتابة المعزز بطريق إثبات آخر؛ وذلك فيما لم يرد فيه نص في هذا النظام.\n2- مبدأ الثبوت بالكتابة هو: كل كتابة تصدر من الخصم ويكون من شأنها أن تجعل وجود التصرف المدعى به قريب الاحتمال."],
  ["ith_52", "٥٢", "الباب الثالث — الكتابة", "الفصل الخامس — أحكام ختامية في الكتابة", "", "مع عدم الإخلال بالتزامات المملكة بموجب الاتفاقيات الدولية التي تكون طرفاً فيها، يجوز للمحكمة أن تقبل في الإثبات المحرَّر الورقي أو الرقمي الصادر خارج المملكة والمصدق عليه من الجهات المختصة في الدولة التي صدر فيها والجهات المختصة في المملكة، وذلك ما لم يخالف النظام العام."],
  ["ith_53", "٥٣", "الباب الرابع — الدليل الرقمي", "", "", "يعد دليلاً رقمياً كل دليل مستمد من أي بيانات تنشأ أو تصدر أو تسلم أو تحفظ أو تبلغ بوسيلة رقمية، وتكون قابلة للاسترجاع أو الحصول عليها بصورة يمكن فهمها."],
  ["ith_54", "٥٤", "الباب الرابع — الدليل الرقمي", "", "", "يشمل الدليل الرقمي الآتي:\n1- السجل الرقمي.\n2- المحرَّر الرقمي.\n3- التوقيع الرقمي.\n4- المراسلات الرقمية بما فيها البريد الرقمي.\n5- وسائل الاتصال.\n6- الوسائط الرقمية.\n7- أي دليل رقمي آخر."],
  ["ith_55", "٥٥", "الباب الرابع — الدليل الرقمي", "", "", "يكون للإثبات بالدليل الرقمي حكم الإثبات بالكتابة الوارد في هذا النظام."],
  ["ith_56", "٥٦", "الباب الرابع — الدليل الرقمي", "", "", "يكون للدليل الرقمي الرسمي الحجية المقررة للمحرَّر الرسمي؛ إذا استوفى الشروط المنصوص عليها في الفقرة (1) من المادة (الخامسة والعشرين) بما في ذلك ما يصدر آلياً من الأنظمة الرقمية للجهات العامة أو الجهات المكلفة بخدمة عامة."],
  ["ith_57", "٥٧", "الباب الرابع — الدليل الرقمي", "", "", "يكون الدليل الرقمي غير الرسمي حجةً على أطراف التعامل -ما لم يثبت خلاف ذلك- في الحالات الآتية:\n1- إذا كان صادراً وفقاً لنظام التعاملات الإلكترونية أو نظام التجارة الإلكترونية.\n2- إذا كان مستفاداً من وسيلة رقمية منصوص عليها في العقد محل النزاع.\n3- إذا كان مستفاداً من وسيلة رقمية موثقة أو مشاعة للعموم."],
  ["ith_58", "٥٨", "الباب الرابع — الدليل الرقمي", "", "", "على الخصم الذي يدعي عدم صحة الدليل الرقمي المنصوص عليه في المادتين (السادسة والخمسين) و(السابعة والخمسين) عبء إثبات ادعائه."],
  ["ith_59", "٥٩", "الباب الرابع — الدليل الرقمي", "", "", "فيما عدا ما نصت عليه المادتان (السادسة والخمسون) و(السابعة والخمسون) من هذا النظام؛ يكون للدليل الرقمي الحجية المقررة للمحرَّر العادي؛ وفقاً لأحكام هذا النظام."],
  ["ith_60", "٦٠", "الباب الرابع — الدليل الرقمي", "", "", "يقدم الدليل الرقمي بهيئته الأصلية، أو بأي وسيلة رقمية أخرى، وللمحكمة أن تطلب تقديم محتواه مكتوباً؛ متى كانت طبيعته تسمح بذلك."],
  ["ith_61", "٦١", "الباب الرابع — الدليل الرقمي", "", "", "إذا امتنع أي من الخصوم عن تقديم ما طلبته المحكمة للتحقق من صحة الدليل الرقمي بغير عذر مقبول؛ سقط حقه في التمسك به أو عدّ حجة عليه بحسب الأحوال."],
  ["ith_62", "٦٢", "الباب الرابع — الدليل الرقمي", "", "", "إذا تعذر التحقق من صحة الدليل الرقمي بسبب لا يعود للخصوم، فتقدر المحكمة حجيته بما يظهر لها من ظروف الدعوى."],
  ["ith_63", "٦٣", "الباب الرابع — الدليل الرقمي", "", "", "1- يكون للمستخرجات من الدليل الرقمي الحجية المقررة للدليل نفسه، وذلك بالقدر الذي تكون فيه المستخرجات مطابقة لسجلها الرقمي.\n2- يسري حكم الفقرة (1) من هذه المادة على المستخرجات من وسائل الدفع الرقمية."],
  ["ith_64", "٦٤", "الباب الرابع — الدليل الرقمي", "", "", "فيما لم يرد فيه نص في هذا الباب، تسري على الدليل الرقمي الأحكام المنصوص عليها في الباب (الثالث) من هذا النظام، بما لا يتعارض مع طبيعته الرقمية."],
  ["ith_65", "٦٥", "الباب الخامس — الشهادة", "الفصل الأول — محل الشهادة", "", "يجوز الإثبات بشهادة الشهود؛ ما لم يرد نص يقضي بغير ذلك."],
  ["ith_66", "٦٦", "الباب الخامس — الشهادة", "الفصل الأول — محل الشهادة", "", "1- يجب أن يثبت بالكتابة كل تصرف تزيد قيمته على (مائة ألف ريال أو ما يعادلها) أو كان غير محدد القيمة.\n2- لا تقبل شهادة الشهود في إثبات وجود أو انقضاء التصرفات الواردة في الفقرة (1) من هذه المادة، ما لم يوجد اتفاق أو نص يقضي بغير ذلك.\n3- يقدر الالتزام باعتبار قيمته وقت صدور التصرف بغير ضم الملحقات إلى الأصل.\n4- إذا اشتملت الدعوى على طلبات متعددة ناشئة عن مصادر متعددة جاز الإثبات بشهادة الشهود في كل طلب لا تزيد قيمته على (مائة ألف ريال أو ما يعادلها)؛ ولو كانت هذه الطلبات في مجموعها تزيد على تلك القيمة، أو كان منشؤها علاقات بين الخصوم أنفسهم أو تصرفات ذات طبيعة واحدة.\n5- تكون العبرة في إثبات الوفاء الجزئي بقيمة الالتزام الأصلي."],
  ["ith_67", "٦٧", "الباب الخامس — الشهادة", "الفصل الأول — محل الشهادة", "", "لا يجوز الإثبات بشهادة الشهود ولو لم تزد قيمة التصرف على (مائة ألف ريال أو ما يعادلها) في الحالات الآتية:\n1- فيما اشترط النظام لصحته أو إثباته أن يكون مكتوباً.\n2- إذا كان المطلوب هو الباقي أو جزء من حق لا يجوز إثباته إلا بالكتابة.\n3- فيما يخالف أو يجاوز ما اشتمل عليه دليل كتابي."],
  ["ith_68", "٦٨", "الباب الخامس — الشهادة", "الفصل الأول — محل الشهادة", "", "يجوز الإثبات بشهادة الشهود فيما كان يجب إثباته بالكتابة في الأحوال الآتية:\n1- إذا وجد مبدأ الثبوت بالكتابة.\n2- إذا وجد مانع مادي أو أدبي يحول دون الحصول على دليل كتابي، ويعد من الموانع المادية عدم وجود من يستطيع الكتابة، أو أن يكون طالب الإثبات شخصاً ثالثاً لم يكن طرفاً في العقد، ويعد من الموانع الأدبية رابطة الزوجية، وصلة القرابة والمصاهرة حتى الدرجة الرابعة.\n3- إذا ثبت أن المدعي فقد دليله الكتابي بسبب لا يد له فيه."],
  ["ith_69", "٦٩", "الباب الخامس — الشهادة", "الفصل الأول — محل الشهادة", "", "تكون الشهادة عن مشاهدة أو معاينة أو سماع، ولا تقبل الشهادة بالاستفاضة إلا فيما يتعذر علمه غالباً دونها، ومن ذلك ما يأتي:\n1- الوفاة.\n2- النكاح.\n3- النسب.\n4- الملك المطلق.\n5- الوقف والوصية ومصرفهما."],
  ["ith_70", "٧٠", "الباب الخامس — الشهادة", "الفصل الثاني — شروط الشهادة وموانعها", "", "1- لا يكون أهلاً للشهادة من لم يبلغ سن (الخامسة عشرة)، ومن لم يكن سليم الإدراك.\n2- يجوز أن تسمع أقوال من لم يبلغ سن (الخامسة عشرة) على سبيل الاستئناس."],
  ["ith_71", "٧١", "الباب الخامس — الشهادة", "الفصل الثاني — شروط الشهادة وموانعها", "", "1- يجب على الشاهد ابتداءً قبل أداء الشهادة الإفصاح عن أي علاقة له بأطراف الدعوى، أو أي مصلحة له فيها.\n2- لا تقبل شهادة من يدفع بالشهادة عن نفسه ضرراً أو يجلب لها نفعاً، ولا تقبل شهادة الأصل للفرع، وشهادة الفرع للأصل، وشهادة أحد الزوجين للآخر ولو بعد افتراقهما، وشهادة الولي أو الوصي للمشمول بالولاية أو الوصاية.\n3- لا يجوز للموظفين والمكلفين بخدمة عامة -ولو بعد تركهم العمل- أن يشهدوا بما يكون قد وصل إلى علمهم بحكم قيامهم بعملهم من معلومات سرية، ما لم ترتفع عنها صفة السرية، أو تأذن الجهة المختصة في الشهادة بها؛ بناءً على طلب المحكمة، أو أحد الخصوم."],
  ["ith_72", "٧٢", "الباب الخامس — الشهادة", "الفصل الثالث — إجراءات الإثبات بالشهادة", "", "1- على الخصم الذي يطلب الإثبات بشهادة الشهود أن يبين الوقائع التي يريد إثباتها، وعدد الشهود وأسماءهم.\n2- إذا أذنت المحكمة لأحد الخصوم بإثبات واقعة بشهادة الشهود كان للخصم الآخر الحق في نفيها بهذا الطريق. وفي جميع الأحوال لا تقبل الشهادة على النفي إلا إذا كان محصوراً.\n3- للمحكمة -من تلقاء نفسها أو بناءً على طلب أحد الخصوم- أن تستدعي للشهادة من ترى لزوماً لسماع شهادته؛ إظهاراً للحقيقة."],
  ["ith_73", "٧٣", "الباب الخامس — الشهادة", "الفصل الثالث — إجراءات الإثبات بالشهادة", "", "إذا طلب أحد الخصوم إمهاله لإحضار شهوده فيمهل مرة واحدة، فإذا لم يحضرهم في الموعد المحدد بغير عذر تقبله المحكمة أو أحضر منهم من لم توصل شهادته؛ فعلى المحكمة أن تفصل في الخصومة."],
  ["ith_74", "٧٤", "الباب الخامس — الشهادة", "الفصل الثالث — إجراءات الإثبات بالشهادة", "", "1- تؤدى الشهادة شفاهاً. ويجوز أداؤها كتابة بإذن المحكمة.\n2- يجوز للمحكمة تحليف الشاهد عند الاقتضاء، وإذا امتنع عن الحلف فتقدر المحكمة أثر ذلك."],
  ["ith_75", "٧٥", "الباب الخامس — الشهادة", "الفصل الثالث — إجراءات الإثبات بالشهادة", "", "1- تؤدى الشهادة بحضور الخصوم، وتسمع شهادة كل شاهد على انفراد إلا لمقتضى معتبر.\n2- تخلف الخصم المشهود عليه لا يمنع من سماع الشهادة. وله الاطلاع على محضر سماع الشهود."],
  ["ith_76", "٧٦", "الباب الخامس — الشهادة", "الفصل الثالث — إجراءات الإثبات بالشهادة", "", "تأخذ المحكمة حال اختلاف شهادة الشهود بالقدر الذي تقتنع بصحته من الشهادة؛ على ألا يؤدي هذا الاختلاف إلى التناقض في شهادتهم."],
  ["ith_77", "٧٧", "الباب الخامس — الشهادة", "الفصل الثالث — إجراءات الإثبات بالشهادة", "", "1- لأي من الخصوم توجيه الأسئلة مباشرة إلى الشاهد، وإذا انتهى الخصم من سؤال الشاهد فلا يجوز له إبداء أسئلة جديدة إلا بإذن المحكمة.\n2- للمحكمة أن توجه للشاهد ما تراه من الأسئلة مفيداً في كشف الحقيقة.\n3- ليس للخصم أن يقطع كلام الشاهد أثناء أداء الشهادة أو الإجابة.\n4- للخصم الاعتراض على سؤال وُجِّه للشاهد، وعليه أن يبين وجه اعتراضه، ويُثبت الاعتراض وما تقرره المحكمة بشأنه في محضر الجلسة.\n5- للشاهد أن يمتنع عن الإجابة على سؤال وُجِّه إليه، وعليه أن يبين وجْه امتناعه، ويُثبت ذلك وما تقرره المحكمة بشأنه في محضر الجلسة."],
  ["ith_78", "٧٨", "الباب الخامس — الشهادة", "الفصل الثالث — إجراءات الإثبات بالشهادة", "", "تدون الشهادة في محضر، تثبت فيه بيانات الشاهد، وجهة اتصاله بالخصوم، ونص شهادته، وإجابته عما وُجِّه إليه من أسئلة."],
  ["ith_79", "٧٩", "الباب الخامس — الشهادة", "الفصل الثالث — إجراءات الإثبات بالشهادة", "", "1- للخصم المشهود عليه أن يبين للمحكمة ما يخل بشهادة الشاهد من طعن فيه أو في شهادته. وتقدر المحكمة أثر ذلك في الشهادة.\n2- للمحكمة تقدير عدالة الشاهد من حيث سلوكه وتصرفه وغير ذلك من ظروف الدعوى، دون حاجة إلى التزكية، ولها عند الاقتضاء الاستعانة في تقدير العدالة بما تراه من وسائل."],
  ["ith_80", "٨٠", "الباب الخامس — الشهادة", "الفصل الثالث — إجراءات الإثبات بالشهادة", "", "إذا ثبت للمحكمة أثناء نظر الدعوى أو عند الحكم في موضوعها أن الشاهد شهد زوراً، فتحرر محضراً بذلك، وتحيله إلى النيابة العامة لاتخاذ الإجراءات اللازمة."],
  ["ith_81", "٨١", "الباب الخامس — الشهادة", "الفصل الرابع — الدعوى المستعجلة لسماع الشهادة", "", "1- يجوز لمن يخشى فوات فرصة الاستشهاد بشاهد على موضوع لم يعرض بعد أمام القضاء ويحتمل عرضه عليه أن يطلب في مواجهة ذوي الشأن سماع هذا الشاهد، ويقدم الطلب بدعوى مستعجلة للمحكمة المختصة، وفقاً للإجراءات المنظمة لذلك، وعند تحقق الضرورة، تسمع المحكمة شهادة الشاهد؛ متى كانت الواقعة مما يجوز إثباتها بشهادة الشهود.\n2- يجوز للمحكمة سماع شهود نفي بناءً على طلب الخصم الآخر بالقدر الذي تقتضيه ظروف الاستعجال في الدعوى.\n3- فيما عدا ذلك تتبع في هذه الشهادة القواعد والإجراءات المنظمة لذلك، ولا يجوز في هذه الدعوى تسليم صورة من محضر سماع الشهادة ولا تقديمه إلى القضاء إلا إذا رأت محكمة الموضوع عند نظره جواز إثبات الواقعة بشهادة الشهود، ويكون للخصم الاعتراض أمامها على قبول هذا الدليل، كما يكون له طلب سماع شهود نفي لمصلحته."],
  ["ith_82", "٨٢", "الباب الخامس — الشهادة", "الفصل الخامس — أحكام ختامية في الشهادة", "", "لا تجوز مضارة الشاهد. وعلى المحكمة أن تمنع كل محاولة ترمي إلى تخويفه أو التأثير عليه عند أداء الشهادة."],
  ["ith_83", "٨٣", "الباب الخامس — الشهادة", "الفصل الخامس — أحكام ختامية في الشهادة", "", "تقدر المحكمة -بناءً على طلب الشاهد- مصروفات انتقاله ومقابل تعطيله، ويتحملها الخصم الذي خسر الدعوى، إلا إذا كانت الخسارة نسبية فيتحمل كل من الخصوم بقدر خسارته. وتبين المحكمة ذلك في الحكم الصادر في موضوع الدعوى."],
  ["ith_84", "٨٤", "الباب السادس — القرائن وحجية الأمر المقضي", "الفصل الأول — القرائن", "", "القرائن المنصوص عليها شرعاً أو نظاماً تغني من قررت لمصلحته عن أي طريق آخر من طرق الإثبات، على أنه يجوز نقض دلالتها بأي طريق آخر؛ ما لم يوجد نص يقضي بغير ذلك."],
  ["ith_85", "٨٥", "الباب السادس — القرائن وحجية الأمر المقضي", "الفصل الأول — القرائن", "", "1- للمحكمة أن تستنبط قرائن أخرى للإثبات، وذلك في الأحوال التي يجوز فيها الإثبات بالشهادة؛ على أن تبين وجه دلالتها.\n2- للمحكمة الاستعانة بالوسائل العلمية في استنباط القرائن."],
  ["ith_86", "٨٦", "الباب السادس — القرائن وحجية الأمر المقضي", "الفصل الثاني — حجية الأمر المقضي", "", "الأحكام التي حازت حجية الأمر المقضي حجةٌ فيما فصلت فيه من الحقوق، ولا يجوز قبول دليل ينقض هذه الحجية. ولا تكون لتلك الأحكام هذه الحجية إلا في نزاع قام بين الخصوم أنفسهم دون أن تتغير صفاتهم، وتعلق بالحق ذاته محلاً وسبباً. وتقضي المحكمة بهذه الحجية من تلقاء نفسها."],
  ["ith_87", "٨٧", "الباب السادس — القرائن وحجية الأمر المقضي", "الفصل الثاني — حجية الأمر المقضي", "", "لا تتقيد المحكمة بالحكم الجزائي المرتبط بالدعوى المعروضة عليها إلا في الوقائع التي فصل فيها ذلك الحكم، وكان فصله فيها ضرورياً، ومع ذلك لا تتقيد بالحكم الصادر بعدم الإدانة إلا إذا قام على نفي نسبة الواقعة إلى المتهم."],
  ["ith_88", "٨٨", "الباب السابع — العرف", "", "", "يجوز الإثبات بالعرف، أو العادة بين الخصوم، وذلك فيما لم يرد فيه نص خاص أو اتفاق بين الأطراف أو فيما لا يخالف النظام العام."],
  ["ith_89", "٨٩", "الباب السابع — العرف", "", "", "1- على من يتمسك بالعرف أو العادة بين الخصوم أن يثبت وجودهما وقت الواقعة.\n2- لأي من الخصوم الطعن في ثبوت العرف أو العادة بين الخصوم، كما أن لهم معارضتهما بما هو أقوى منهما."],
  ["ith_90", "٩٠", "الباب السابع — العرف", "", "", "تقدم العادة بين الخصوم والعرف الخاص على العرف العام عند التعارض."],
  ["ith_91", "٩١", "الباب السابع — العرف", "", "", "للمحكمة عند الاقتضاء ندب خبير للتحقق من ثبوت العرف أو العادة بين الخصوم، وفقاً للأحكام المقررة في الباب (العاشر) من هذا النظام."],
  ["ith_92", "٩٢", "الباب الثامن — اليمين", "الفصل الأول — أحكام عامة", "", "1- اليمين الحاسمة: هي التي يؤديها المدعى عليه لدفع الدعوى، ويجوز ردها على المدعي، وفقاً للأحكام الواردة في هذا الباب.\n2- اليمين المتممة: هي التي يؤديها المدعي لإتمام البينة، ولا يجوز ردها على المدعى عليه، وفقاً للأحكام الواردة في هذا الباب."],
  ["ith_93", "٩٣", "الباب الثامن — اليمين", "الفصل الأول — أحكام عامة", "", "تكون اليمين في جانب أقوى المتداعيين."],
  ["ith_94", "٩٤", "الباب الثامن — اليمين", "الفصل الأول — أحكام عامة", "", "1- يشترط أن يكون الحالف أهلاً للتصرف فيما يحلف عليه.\n2- لا تقبل النيابة في أداء اليمين، وتقبل -بتوكيل خاص- في توجيه اليمين وقبولها والنكول عنها وردها."],
  ["ith_95", "٩٥", "الباب الثامن — اليمين", "الفصل الأول — أحكام عامة", "", "1- إذا كانت الواقعة التي تنصب عليها اليمين متعلقة بالحالف أو بإثبات فعل غيره؛ حلف على البت. وإذا كانت متعلقة بنفي فعل غيره حلف على نفي العلم إلا أن يكون المحلوف عليه مما يمكن أن يحيط به علم الحالف؛ فيحلف على البت.\n2- يكون أداء اليمين بالصيغة التي تقرها المحكمة."],
  ["ith_96", "٩٦", "الباب الثامن — اليمين", "الفصل الثاني — اليمين الحاسمة", "", "1- يجوز أن توجه اليمين في الحقوق المالية، وفي أي حالة تكون عليها الدعوى، وفقاً للأحكام الواردة في هذا الباب.\n2- لا يجوز توجيه اليمين في واقعة مخالفة للنظام العام.\n3- على المحكمة منع توجيه اليمين إذا كانت غير متعلقة بالدعوى أو غير منتجة أو غير جائز قبولها. وللمحكمة منع توجيهها إذا كان الخصم متعسفاً في ذلك."],
  ["ith_97", "٩٧", "الباب الثامن — اليمين", "الفصل الثاني — اليمين الحاسمة", "", "1- إذا عجز المدعي عن البينة وطلب يمين خصمه حُلِّف، فإن نكل ردت اليمين على المدعي بطلب المدعى عليه، فإذا نكل المدعي عن اليمين المردودة رُدّت دعواه.\n2- لا تُرد اليمين فيما ينفرد المدعى عليه بعلمه، ويقضى عليه بنكوله.\n3- للمدعي طلب يمين خصمه، ما لم يُفصل في الدعوى بحكم نهائي.\n4- لا يجوز لمن وجه اليمين أو ردها أن يرجع في ذلك متى قَبِل خصمه أن يحلف."],
  ["ith_98", "٩٨", "الباب الثامن — اليمين", "الفصل الثاني — اليمين الحاسمة", "", "كل مـن وجهـت إليـه اليمين فحلفها حُكم لصالحه، أما إذا نكل عنها دون أن يردها على خصمه حكم عليه بعد إنذاره، وكذلك من ردت عليه اليمين فنكل عنها."],
  ["ith_99", "٩٩", "الباب الثامن — اليمين", "الفصل الثاني — اليمين الحاسمة", "", "1- للمدعي إسقاط بينته وتوجيه اليمين للمدعى عليه مباشرة.\n2- للمدعي توجيه اليمين للمدعى عليه قبل إحضار بينته المعلومة، ويعد ذلك إسقاطاً منه لبينته؛ بعد إعلام المحكمة له بذلك.\n3- مع مراعاة ما ورد في الفقرة (2) من هذه المادة، لا يجوز للخصم أن يثبت كذب اليمين بعد أن يؤديها الخصم الذي وجهت إليه أو ردت عليه، على أنه إذا ثبت كذب اليمين بحكم جزائي، فإن للخصم الذي أصابه ضرر منها أن يطالب بالتعويض، دون إخلال بما قد يكون له مـن حق الاعتراض على الحكم الذي صدر عليه بسبب اليمين الكاذبة."],
  ["ith_100", "١٠٠", "الباب الثامن — اليمين", "الفصل الثاني — اليمين الحاسمة", "", "للولي والوصي وناظر الوقف ومن في حكمهم توجيه اليمين والنكول عنها وردها فيما يجوز لهم التصرف فيه، وتوجه لهم اليمين فيما باشروا التصرف فيه."],
  ["ith_101", "١٠١", "الباب الثامن — اليمين", "الفصل الثاني — اليمين الحاسمة", "", "يجب على من يوجه اليمين إلى خصمه أن يبين بدقة الوقائع التي يريد استحلافه عليها، ويذكر الصيغة بعبارة واضحة، وللمحكمة أن تعدلها لتوجه بوضوح ودقة على الواقعة المطلوب الحلف عليها."],
  ["ith_102", "١٠٢", "الباب الثامن — اليمين", "الفصل الثاني — اليمين الحاسمة", "", "يجب أن يكون أداء اليمين في مواجهة طالبها إلا إذا قرر تنازله عن حضور أدائها، أو تخلف مع علمه بموعد الجلسة."],
  ["ith_103", "١٠٣", "الباب الثامن — اليمين", "الفصل الثاني — اليمين الحاسمة", "", "1- من دعي للحضور إلى المحكمة لأداء اليمين وجب عليه الحضور.\n2- إذا حضر من وجهت إليه اليمين بنفسه ولم ينازع في جوازها أو في تعلقها بالدعوى، وجب عليه أن يؤديها فوراً أو يردها على خصمه وإلا عد ناكلاً، وإن تخلف عن الحضور بغير عذر عدّ ناكلاً.\n3- إذا حضر من وجهت إليه اليمين ونازع في جوازها أو في تعلقها بالدعوى لزمه بيان ذلك، فإن لم تقتنع المحكمة بذلك وجب عليه أداء اليمين، وإلا عدّ ناكلاً."],
  ["ith_104", "١٠٤", "الباب الثامن — اليمين", "الفصل الثاني — اليمين الحاسمة", "", "1- تتعدد اليمين بتعدد المستحقين لها؛ ما لم يكونوا شركاء في الحق أو يكتفوا بيمين واحدة.\n2- تتعدد اليمين بتعدد من وجهت إليه.\n3- يجوز للمحكمة الاكتفاء بيمين واحدة إذا اجتمعت طلبات متعددة."],
  ["ith_105", "١٠٥", "الباب الثامن — اليمين", "الفصل الثالث — اليمين المتممة", "", "1- توجه المحكمة اليمين المتممة للمدعي إذا قدم دليلاً ناقصاً في الحقوق المالية، فإن حلف حُكم له، وإن نكل لم يعتد بدليله.\n2- تكون اليمين المتممة على البت.\n3- لا يجوز رد اليمين المتممة على الخصم الآخر."],
  ["ith_106", "١٠٦", "الباب الثامن — اليمين", "الفصل الثالث — اليمين المتممة", "", "يؤدي اليمين المتممة الولي والوصي وناظر الوقف ومن في حكمهم فيما باشروا التصرف فيه."],
  ["ith_107", "١٠٧", "الباب الثامن — اليمين", "الفصل الثالث — اليمين المتممة", "", "إذا تعدد المدعون وقدموا دليلاً ناقصاً، وجهت المحكمة اليمين المتممة لهم جميعاً، فمن حلف حكم له، ومن نكل لم يعتد بدليله."],
  ["ith_108", "١٠٨", "الباب التاسع — المعاينة", "", "", "1- للمحكمة -من تلقاء نفسها أو بناءً على طلب أحد الخصوم- أن تقرر معاينة المتنازع فيه، وتحدد في قرار المعاينة تاريخها ومكانها، ويبلغ به من كان غائباً من الخصوم قبل الموعد المقرر بـ(أربع وعشرين) ساعة على الأقل.\n2- للمحكمة ندب خبير للاستعانة به في المعاينة، ولها سماع من ترى سماعه من الشهود."],
  ["ith_109", "١٠٩", "الباب التاسع — المعاينة", "", "", "1- يجوز لمن يخشى ضياع معالم واقعة يحتمل أن تصبح محل نزاع أمام القضاء أن يطلب معاينتها وإثبات حالتها، ويقدم الطلب بدعوى مستعجلة للمحكمة المختصة وفقاً للإجراءات المنظمة لذلك، وتراعى في المعاينة وإثبات الحالة أحكام المادة (الثامنة بعد المائة).\n2- يجوز للمحكمة في حال التقدم بدعوى لها أن تندب خبيراً للانتقال والمعاينة وسماع أقوال من يرى لزوم سماع أقواله، ويتعين على المحكمة أن تحدد جلسة لسماع ملحوظات الخصوم على تقرير الخبير وأعماله. وتتبع القواعد المنصوص عليها في الباب (العاشر) من هذا النظام."],
  ["ith_110", "١١٠", "الباب العاشر — الخبرة", "", "", "1- للمحكمة -من تلقاء نفسها أو بناءً على طلب أحد الخصوم- أن تقرر ندب خبير أو أكثر؛ لإبداء رأيه في المسائل الفنية التي يستلزمها الفصل في الدعوى.\n2- يراعى في اختيار الخبير تناسب معارفه الفنية وخبراته مع موضوع النزاع.\n3- إذا اتفق الخصوم على اختيار خبير أو أكثر أقرت المحكمة اتفاقهم."],
  ["ith_111", "١١١", "الباب العاشر — الخبرة", "", "", "يجب أن يتضمن منطوق قرار ندب الخبير بياناً دقيقاً بمهمته، وصلاحياته، والتدابير العاجلة التي يؤذن له في اتخاذها."],
  ["ith_112", "١١٢", "الباب العاشر — الخبرة", "", "", "1- تحدد المحكمة -عند الاقتضاء- المبلغ المقرر للخبرة، والخصم المكلف بإيداع المبلغ وتعين أجلاً لذلك.\n2- إذا لم يودع الخصم المكلف المبلغ المقرر للخبرة في الأجل المعين، فيجوز للخصم الآخر أن يودع المبلغ دون إخلال بحقه في الرجوع على خصمه.\n3- إذا لم يودع المبلغ أيّ من الخصمين، فللمحكمة أن تقرر إيقاف الدعوى إلى حين الإيداع؛ متى كان الفصل فيها متوقفاً على قرار الخبرة، أو تقرر سقوط حق الخصم في التمسك بقرار الندب إذا وجدت أن الأعذار التي أبداها غير مقبولة."],
  ["ith_113", "١١٣", "الباب العاشر — الخبرة", "", "", "يجب على الخبير قبل مباشرته المهمة أن يفصح عن أي علاقة له بأطراف الدعوى أو أي مصلحة له فيها، فإن أخل بذلك حكمت المحكمة بعزله وبرد ما تسلمه من مبالغ. ويكون الحكم نهائياً غير قابل للاعتراض، وذلك دون إخلال بالجزاءات التأديبية وبحق ذوي الشأن في الرجوع عليه بالتعويضات."],
  ["ith_114", "١١٤", "الباب العاشر — الخبرة", "", "", "1- يجوز لأي من الخصوم طلب رد الخبير إذا توافر في شأنه سبب يرجح معه عدم استطاعته أداء مهمته بحياد، وبوجه خاص يجوز رد الخبير إذا كان قريباً أو صهراً لأحد الخصوم إلى الدرجة الرابعة أو وكيلاً لأحدهم في أعماله الخاصة، أو وصياً لأحد الخصوم أو ولياً عليه أو ناظر وقف أو من في حكمهم، أو كان يعمل عند أحد الخصوم، أو كانت له خصومة مع أحدهم؛ ما لم تكن هذه الخصومة قد أقيمت بعد تعيين الخبير بقصد رده.\n2- لا يقبل طلب الرد ممن نُدب الخبير بناءً على اختياره إلا إذا كان سبب الرد حدث بعد ندبه. وفي جميع الأحوال لا يقبل طلب الرد بعد قفل باب المرافعة.\n3- تفصل المحكمة في طلب الرد خلال (ثلاثة) أيام من تاريخ تقديم إجابة الخبير أو من تاريخ انتهاء المهلة المقررة لتقديمها، ويكون الحكم الصادر في الطلب نهائياً غير قابل للاعتراض."],
  ["ith_115", "١١٥", "الباب العاشر — الخبرة", "", "", "للخبير -في سبيل أداء مهمته- الآتي:\n1- سماع أقوال الخصوم وملحوظاتهم، وكل من يرى سماع أقواله إذا تضمن قرار الندب الإذن له بذلك.\n2- أن يطلب مـن الخصـوم أو غيـرهم تسليمـه أو إطلاعـه علـى الدفـاتر أو السجلات أو المستندات أو الأوراق أو الأشياء التي يراها ضرورية لتنفيذ مهمته.\n3- معاينة المنشآت والأماكن والأشياء التي يلزم معاينتها لتنفيذ مهمته."],
  ["ith_116", "١١٦", "الباب العاشر — الخبرة", "", "", "1- لا يجوز لأي شخص أن يمتنع بغير مسوّغ نظامي عن تمكين الخبير من أداء مهمته وفقاً لما قررته المادة (الخامسة عشرة بعد المائة)، وعلى الخبير في حال الامتناع أن يرفع عن ذلك إلى المحكمة، ولها أن تقرر ما تراه بما في ذلك إلزام الممتنع والاستعانة بالقوة الجبرية عند الاقتضاء.\n2- يجب على الخبير الرفع إلى المحكمة إذا اعترضت عمله عقبة حالت دون متابعة مهمته أو تطلّب الأمر توسيع نطاق مهمته، وعلى المحكمة أن تقرر ما تراه."],
  ["ith_117", "١١٧", "الباب العاشر — الخبرة", "", "", "1- يعد الخبير تقريراً عن أعماله، ويجب أن يشمل ما يأتي:\nأ- بيان المهمة المكلف بها وفقاً لقرار الندب.\nب- الأعمال التي أنجزها بالتفصيل، وأقوال الخصوم وغيرهم، وما قدموه من مستندات وأدلة، والتحليل الفني لها.\nج- آراء الخبراء الذين استعان بهم.\nد- نتيجة أعماله ورأيه الفني، والأوجه التي استند إليها بدقة ووضوح.\n2- إذا تعدّد الخبراء فعليهم أن يعدوا تقريراً واحداً، وفي حال اختلاف آرائهم فعليهم أن يذكروا في التقرير رأي كل منهم وأسبابه."],
  ["ith_118", "١١٨", "الباب العاشر — الخبرة", "", "", "1- إذا لم يباشر الخبير مهمته دون عذر مقبول أو قصر في أدائها، أو تأخر عن إيداع التقرير في الموعد المحدد بلا مبرر، فيوجه إليه إنذار في موعد لا يتجاوز (خمسة) أيام من ذلك، فإن لم يستجب خلال (خمسة) أيام من تبلغه بالإنذار حكمت المحكمة بعزله وتأمره برد ما تسلمه من مبالغ، وذلك دون إخلال بالجزاءات التأديبية وبحق ذوي الشأن في مطالبته بالتعويضات.\n2- يكون الحكم الصادر بعزل الخبير وإلزامه برد ما تسلمه نهائياً غير قابل للاعتراض.\n3- إذا تبين للمحكمة أن التأخير ناشئ عن خطأ أحد الخصوم حكمت عليه بغرامة لا تزيد على (عشرة آلاف) ريال، ولها أن تحكم بسقوط حقه في التمسك بقرار ندب الخبير."],
  ["ith_119", "١١٩", "الباب العاشر — الخبرة", "", "", "إذا انتهت مهمة الخبير وجب عليه أن يعيد جميع ما تسلمه من أوراق أو مستندات أو غيرها خلال (عشرة) أيام من تاريخ انتهاء المهمة، فإذا امتنع دون عذر مقبول حكمت عليه المحكمة بتسليم جميع ما تسلمه وبغرامة لا تزيد على (عشرة آلاف) ريال، ويكون حكمها نهائياً غير قابل للاعتراض."],
  ["ith_120", "١٢٠", "الباب العاشر — الخبرة", "", "", "للمحكمة -من تلقاء نفسها، أو بناءً على طلب أحد الخصوم، وفي أي مرحلة تكون عليها الدعوى- أن تتخذ الآتي:\n1- الأمر باستدعاء الخبير في جلسة تحددها لمناقشته في تقريره شفاهاً أو كتابة، ولها أن توجه إليه ما تراه من الأسئلة.\n2- أمر الخبير باستكمال أوجه النقص في عمله وتدارك ما تبينته من أوجه القصور أو الخطأ فيه، كما أن لها أن تندب خبيراً أو أكثر لينضم إلى الخبير السابق ندبه.\n3- ندب خبير آخر أو أكثر لاستكمال أوجه النقص في عمل الخبير السابق وتدارك ما تبين فيه من أوجه القصور أو الخطأ أو إعادة بحث المهمة. ولمن تندبه المحكمة أن يستعين بمعلومات الخبير السابق."],
  ["ith_121", "١٢١", "الباب العاشر — الخبرة", "", "", "1- يجوز للخصوم، ولو قبل رفع الدعوى، الاتفاق على قبول نتيجة تقرير الخبير، وتُعمل المحكمة اتفاقهم؛ ما لم يتضمن التقرير ما يخالف النظام العام.\n2- مع عدم الإخلال بحكم الفقرة (1) من هذه المادة، لا يقيد رأي الخبير المحكمة، وإذا لم تأخذ المحكمة به كله أو بعضه بينت أسباب ذلك في حكمها.\n3- للمحكمة إذا لم تأخذ بتقرير الخبير كله أو بعضه بسبب إهمال الخبير أو خطئه أن تأمره برد جميع ما تسلمه أو بعضه -بحسب الأحوال-، وذلك دون إخلال بالجزاءات التأديبية وبحق ذوي الشأن في الرجوع عليه بالتعويضات."],
  ["ith_122", "١٢٢", "الباب العاشر — الخبرة", "", "", "يتحمل الخصم الذي خسر المطالبة محل الخبرة المبلغ المقرر للخبرة، إلا إذا كانت الخسارة نسبية فيتحمل كل من الخصوم بقدر خسارته، وتبين المحكمة ذلك في الحكم الصادر في موضوع الدعوى."],
  ["ith_123", "١٢٣", "الباب العاشر — الخبرة", "", "", "1- استثناءً من الإجراءات المنظمة للخبرة، يجوز للمحكمة -بقرار تثبته في محضر الجلسة- أن تندب خبيراً لإبداء رأيه شفاهاً في مسألة فنية يسيرة لا تتطلب عملاً مطولاً أو معقداً، وللمحكمة أن تقرر تقديم الرأي مكتوباً.\n2- تحدّد المحكمة في القرار موعد الجلسة التي يقدم فيها الخبير رأيه شفاهاً أو الأجل الذي يجب تقديم الرأي المكتوب فيه."],
  ["ith_124", "١٢٤", "الباب العاشر — الخبرة", "", "", "يجوز للمحكمة الاستناد إلى تقرير خبير مقدم في دعوى أخرى عوضاً عن الاستعانة بخبير في الدعوى، وذلك دون إخلال بحق الخصوم في مناقشة ما ورد في ذلك التقرير."],
  ["ith_125", "١٢٥", "الباب الحادي عشر — أحكام ختامية", "", "", "1- يطبق على الإجراءات المتعلقة بالإثبات أحكام نظام المرافعات الشرعية أو نظام المحاكم التجارية -بحسب الحال- فيما لم يرد فيه نص في هذا النظام.\n2- مع مراعاة ما ورد في الفقرة (1) من هذه المادة، تطبق الأحكام المستمدة من الشريعة الإسلامية الأكثر ملاءمة لترجيحات هذا النظام على مسائل الإثبات التي لم يرد في شأنها نص في هذا النظام."],
  ["ith_126", "١٢٦", "الباب الحادي عشر — أحكام ختامية", "", "", "1- يصدر وزير العدل بالتنسيق مع المجلس الأعلى للقضاء الآتي:\nأ- ضوابط إجراءات الإثبات إلكترونياً.\nب- القواعد الخاصة بتنظيم شؤون الخبرة أمام المحاكم.\nج- الأدلة الإجرائية والقرارات اللازمة لتنفيذ هذا النظام.\n2- تنشر الضوابط والقواعد والأدلة الإجرائية المشار إليها في الفقرة (1) من هذه المادة في الجريدة الرسمية، ويعمل بها من تاريخ العمل بهذا النظام."],
  ["ith_127", "١٢٧", "الباب الحادي عشر — أحكام ختامية", "", "", "يجوز الاستعانة بالقطاع الخاص في إجراءات الإثبات، ويصدر وزير العدل بالتنسيق مع المجلس الأعلى للقضاء القواعد المنظمة لذلك."],
  ["ith_128", "١٢٨", "الباب الحادي عشر — أحكام ختامية", "", "", "يلغي هذا النظام الباب (التاسع) من نظام المرافعات الشرعية الصادر بالمرسوم الملكي رقم (م/1) وتاريخ 22 /1/ 1435هـ، والباب (السابع) من نظام المحاكم التجارية الصادر بالمرسوم الملكي رقم (م/93) وتاريخ 15 /8/ 1441هـ، ويلغي كل ما يتعارض معه من أحكام."],
  ["ith_129", "١٢٩", "الباب الحادي عشر — أحكام ختامية", "", "", "يعمل بهذا النظام بعد (مائة وثمانين) يوماً من تاريخ نشره في الجريدة الرسمية."],
  ],
}];

function render() {
  const view = Views[Router.current.view] || Views.home;
  $('#view').innerHTML = view();
  renderNav();
}

function init() {
  Store.installBundled(BUNDLED_LAWS);
  bindEvents();
  Router.start();
  render();
  Store.setSaverState('done', 'آخر حفظ محلي');
}

document.addEventListener('DOMContentLoaded', init);

return { Store, Model, Router, State };
})();
