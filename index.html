<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاشية — تدوين المعرفة القانونية</title>
<meta name="description" content="دفتر شخصي لتدوين الحواشي على مواد الأنظمة السعودية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230f0e0d'/><text x='16' y='23' font-size='20' fill='%23fafaf9' text-anchor='middle' font-family='serif'>ح</text></svg>">
<style>
/* ══════════════════════════════════════════════════════
   نظام التصميم — أحادي اللون، شبكة ٤ بكسل، بلا ظلال
   ══════════════════════════════════════════════════════ */
:root{
  --surface:#fafaf9;
  --elevated:#eeeeed;
  --ink:#0f0e0d;
  --muted:#8f8b85;
  --danger:#7a1f1f;
  --border-subtle:rgba(51,49,44,.16);
  --border-strong:rgba(51,49,44,.34);
  --r:4px;
  --dur:.15s;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --side:224px;
  --maxw:1200px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--surface);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;
  font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;text-align:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,h5{font-weight:400}
ul{list-style:none}
::selection{background:var(--ink);color:var(--surface)}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--muted);border-radius:var(--r)}
[hidden]{display:none !important}

/* ─── الهيكل ─── */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{
  border-inline-start:1px solid var(--border-subtle);
  position:sticky;top:0;height:100vh;z-index:40;
  display:flex;flex-direction:column;padding:var(--s5) var(--s4);
  background:var(--surface);
}
.main{min-width:0}
.canvas{max-width:var(--maxw);margin:0 auto;padding:var(--s5) 40px 96px}

/* ─── الهوية والتنقل ─── */
.brand{font-family:Amiri,serif;font-size:26px;line-height:1;letter-spacing:-.28px}
.brand small{
  display:block;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:10px;
  color:var(--muted);margin-top:6px;line-height:1.4;letter-spacing:0;
}
.nav{margin-top:32px;display:flex;flex-direction:column;gap:1px}
.nav a{
  display:flex;align-items:center;gap:var(--s2);padding:7px var(--s2);
  border-radius:var(--r);font-size:12.5px;color:var(--muted);
  transition:color var(--dur),background var(--dur);
}
.nav a:hover{color:var(--ink);background:var(--elevated)}
.nav a[aria-current="page"]{color:var(--surface);background:var(--ink)}
.nav .ico{width:14px;text-align:center;font-size:11px;opacity:.85;flex:none}
.nav .n{margin-inline-start:auto;font-size:10px;opacity:.6;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding-top:var(--s4);border-top:1px solid var(--border-subtle)}
.saver{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.pip{width:5px;height:5px;border-radius:50%;background:var(--muted);flex:none;transition:background var(--dur)}
.saver[data-state="busy"] .pip{background:var(--danger)}
.saver[data-state="done"] .pip{background:var(--ink)}
.side-foot button{display:block;font-size:10px;color:var(--muted);margin-top:var(--s2)}
.side-foot button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}

/* ─── ترويسات ─── */
.eyebrow{
  font-size:11px;font-weight:500;color:var(--muted);
  display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3);
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--border-subtle)}
.phead{
  display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;
  margin-bottom:var(--s5);padding-bottom:var(--s4);
  border-bottom:1px solid var(--border-strong);
}
.phead > div:first-child{min-width:0;flex:1}
h2,.h2{font-family:Amiri,serif;font-size:28px;line-height:1.15;letter-spacing:-.28px}
.lede{color:var(--muted);font-size:12.5px;max-width:60ch;margin-top:6px}
.crumb{font-size:11px;color:var(--muted);display:inline-block;margin-bottom:var(--s3)}
.crumb:hover{color:var(--ink)}

/* ─── أزرار ─── */
.btn{
  background:var(--ink);color:var(--surface);border-radius:var(--r);
  padding:7px var(--s3);font-size:12px;font-weight:500;
  transition:opacity var(--dur);white-space:nowrap;
}
.btn:hover{opacity:.84}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border-strong)}
.btn.ghost:hover{background:var(--elevated);opacity:1}
.btn.ghost:disabled:hover{background:transparent}
.btn.sm{padding:4px var(--s2);font-size:11px}

/* ─── حقول ─── */
label{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:5px}
input,textarea,select{
  width:100%;background:#fff;border:1px solid var(--border-subtle);
  border-radius:6px;padding:var(--s2) var(--s3);font-size:13px;line-height:1.6;
  font-family:inherit;
}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{
  outline:none;border-color:var(--border-strong);box-shadow:0 0 0 2px var(--muted);
}
input::placeholder,textarea::placeholder{color:var(--muted)}
.field{margin-bottom:var(--s3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}

/* ─── بطاقات ─── */
.card{
  background:#fff;border:1px solid var(--border-subtle);border-radius:var(--r);
  padding:var(--s4);margin-bottom:var(--s3);transition:border-color var(--dur);
}
.card:hover{border-color:var(--border-strong)}
.card-meta{display:flex;align-items:center;gap:var(--s2);font-size:11px;color:var(--muted);flex-wrap:wrap}
.card-meta .link{font-weight:500;color:var(--ink)}
.card-meta .link:hover{text-decoration:underline;text-underline-offset:3px}
.dot{width:2px;height:2px;border-radius:50%;background:var(--muted);flex:none}
.spacer{margin-inline-start:auto}

/* ─── سكة نوع الحاشية ─── */
.note-body{
  border-inline-start:2px solid var(--ink);padding-inline-start:var(--s3);
  margin-top:var(--s3);white-space:pre-wrap;word-break:break-word;
}
.note[data-type="sharh"]  .note-body{border-inline-start-style:solid}
.note[data-type="tatbiq"] .note-body{border-inline-start-style:double;border-inline-start-width:4px}
.note[data-type="sual"]   .note-body{border-inline-start-style:dotted;border-inline-start-width:3px}
.tlabel{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.3px}

/* ─── نص المادة ─── */
.matn{
  font-family:Amiri,serif;font-size:20px;line-height:1.8;
  background:#fff;border:1px solid var(--border-subtle);
  border-radius:var(--r);padding:var(--s4) var(--s5);white-space:pre-line;
}
.matn.sm{font-size:17px;background:var(--surface);padding:var(--s3) var(--s4)}

/* ─── وسوم المواضيع ─── */
.topic{
  display:inline-block;font-size:11px;color:var(--muted);
  border:1px solid var(--border-subtle);border-radius:var(--r);
  padding:1px 7px;transition:all var(--dur);
}
.topic:hover{border-color:var(--border-strong);color:var(--ink)}
.topic.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.topics{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s3)}
.tag-inline{font-weight:500;border-bottom:1px dashed var(--border-strong);cursor:pointer}
.tag-inline:hover{background:var(--elevated)}
.topics .spacer{flex:1}
.topic.danger{color:var(--danger);border-color:rgba(122,31,31,.3)}
.topic.danger:hover{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.ghost.danger{color:var(--danger);border-color:var(--danger)}
.phead-acts{display:flex;gap:var(--s2);flex-wrap:wrap}
.datepick{display:flex;gap:var(--s1);align-items:center;flex-wrap:wrap}
.datepick select,.datepick input{width:auto;flex:none;padding:6px var(--s2);font-size:12px}
.field select.narrow{width:auto;min-width:200px}
.datepick select[aria-label="الشهر"]{min-width:104px}
.datepick input[type="number"]{width:76px}
.datepick-echo{font-size:10.5px;color:var(--muted);margin-top:5px}
.mention{
  font-weight:500;font-size:.94em;padding:0 4px;border-radius:var(--r);
  background:var(--elevated);border:1px solid var(--border-subtle);cursor:pointer;
}
.mention:hover{border-color:var(--border-strong)}
.src{font-style:italic}
.src-new{width:auto;max-width:180px;padding:5px var(--s2);font-size:11.5px}
.pick{display:contents}

/* ─── الموضوع الرئيسي وأصل الحاشية ─── */
.topic-head{
  display:inline-block;font-family:Amiri,serif;font-size:18px;line-height:1.2;
  margin-top:var(--s3);border-bottom:1px solid var(--border-strong);
}
.topic-head:hover{background:var(--elevated)}
.ghosted{color:var(--muted)}
.ghosted s{text-decoration-thickness:1px}
.free{font-weight:500;color:var(--ink)}
.compose-block{margin-bottom:var(--s5)}

/* ─── طيّة (الديباجة) ─── */
.fold{
  border:1px solid var(--border-subtle);border-radius:var(--r);
  background:#fff;padding:var(--s3) var(--s4);margin-top:var(--s3);
}
.fold summary{font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:"◂ "}
.fold[open] summary{color:var(--ink);margin-bottom:var(--s3)}
.fold[open] summary::before{content:"▾ "}
.fold .matn{border:none;padding:0;background:transparent}

/* ─── مرشِّحات ─── */
.chips{display:flex;flex-wrap:wrap;gap:var(--s1);align-items:center;margin-bottom:var(--s4)}
.chip{
  padding:5px var(--s3);border:1px solid var(--border-subtle);border-radius:var(--r);
  font-size:11px;font-weight:500;color:var(--muted);transition:all var(--dur);
}
.chip:hover{border-color:var(--border-strong);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ─── المحرِّر ─── */
.composer{border:1px solid var(--border-strong);border-radius:var(--r);background:#fff;padding:var(--s4)}
.composer-wrap{position:relative}
.composer textarea{border:none;padding:0;font-size:13.5px;min-height:76px}
.composer textarea:focus{box-shadow:none}
.composer-foot{
  display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3);
  padding-top:var(--s3);border-top:1px solid var(--border-subtle);flex-wrap:wrap;
}
.composer-foot select{width:auto;padding:5px var(--s2);font-size:11.5px;border-radius:var(--r)}
.composer-hint{font-size:10.5px;color:var(--muted)}

/* قائمة المواضيع المنسدلة */
.ac{
  position:absolute;z-index:30;inset-inline-start:0;inset-inline-end:0;
  background:#fff;border:1px solid var(--border-strong);border-radius:var(--r);
  max-height:196px;overflow-y:auto;
}
.ac li{
  padding:6px var(--s3);font-size:12px;display:flex;align-items:center;gap:var(--s2);
  cursor:pointer;border-top:1px solid var(--border-subtle);
}
.ac li:first-child{border-top:none}
.ac li[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.ac li .n{
  margin-inline-start:auto;font-size:10px;opacity:.6;
  max-width:64%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ac li > span:first-child{flex:none}
.ac .new{color:var(--muted);font-style:normal}
.ac li[aria-selected="true"] .new{color:var(--surface);opacity:.75}

/* ─── لوحة الرئيسية ─── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s5)}
.stat{border:1px solid var(--border-subtle);border-radius:var(--r);padding:var(--s3);background:#fff}
.stat b{display:block;font-family:Amiri,serif;font-size:28px;line-height:1.15;font-weight:400}
.stat span{font-size:10.5px;color:var(--muted)}
.dash{display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:start}
.box{border:1px solid var(--border-subtle);border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);background:#fff}
.box h4{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:var(--s3)}
.row{
  display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);
  padding:6px 0;border-top:1px solid var(--border-subtle);font-size:12px;width:100%;
}
.row:first-of-type{border-top:none;padding-top:0}
.row:hover .rl{text-decoration:underline;text-underline-offset:3px}
.rl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row b{font-family:Amiri,serif;font-size:17px;font-weight:400;flex:none}

/* ─── بطاقة تشريع ─── */
.law-card{display:block;width:100%}
.law-title{font-family:Amiri,serif;font-size:24px;line-height:1.2;letter-spacing:-.28px;margin-top:6px}
.law-card:hover .law-title{text-decoration:underline;text-underline-offset:4px}
.meta-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
  gap:0;border:1px solid var(--border-subtle);border-radius:var(--r);background:#fff;overflow:hidden;
}
.meta-grid div{padding:var(--s3) var(--s4);border-inline-start:1px solid var(--border-subtle)}
.meta-grid div:first-child{border-inline-start:none}
.meta-grid dt{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.meta-grid dd{font-size:13px;font-weight:500}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11px}
.status::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink)}
.status[data-s="ملغى"]{color:var(--danger)}
.status[data-s="ملغى"]::before{background:var(--danger)}
.status[data-s="معدّل"]::before{background:var(--muted)}

/* ─── قائمة المواد ─── */
.art-row{
  display:flex;align-items:baseline;gap:var(--s3);width:100%;
  padding:var(--s2) var(--s3);border-top:1px solid var(--border-subtle);
  transition:background var(--dur);
}
.art-row:first-of-type{border-top:none}
.art-row:hover{background:var(--elevated)}
.art-no{font-family:Amiri,serif;font-size:17px;flex:none;min-width:46px}
.art-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.art-n{font-size:10.5px;color:var(--muted);flex:none}
.part{
  font-family:Amiri,serif;font-size:16px;color:var(--ink);
  padding:var(--s4) var(--s3) var(--s2);margin-top:var(--s2);
  border-top:1px solid var(--border-subtle);
}
.part:first-child{border-top:none;margin-top:0;padding-top:var(--s2)}
.chapter{font-size:11px;font-weight:600;color:var(--muted);padding:var(--s3) var(--s3) var(--s2)}
.branch{
  font-size:10.5px;color:var(--muted);opacity:.85;
  padding:var(--s1) var(--s3) var(--s2);padding-inline-start:var(--s5);
}
.trail{font-size:11px;color:var(--muted);margin-bottom:var(--s3);line-height:1.7}

/* ─── تنقل المواد ─── */
.pager{display:flex;gap:var(--s2);align-items:center;margin-top:var(--s5)}
.pager .pos{font-size:11px;color:var(--muted);margin-inline-start:auto}

/* ─── حالات ونوافذ ─── */
.empty{border:1px dashed var(--border-strong);border-radius:var(--r);padding:36px var(--s5);text-align:center}
.empty p{font-size:12px;color:var(--muted);margin:var(--s2) auto 0;max-width:46ch}
.empty .btn{margin-top:var(--s4)}
.modal{
  position:fixed;inset:0;z-index:100;background:rgba(15,14,13,.42);
  display:flex;align-items:flex-start;justify-content:center;padding:7vh var(--s5) var(--s5);
}
.sheet{
  background:var(--surface);border-radius:var(--r);padding:var(--s5);
  max-width:640px;width:100%;max-height:86vh;overflow-y:auto;
}
.sheet h3{font-family:Amiri,serif;font-size:26px;line-height:1.15;margin-bottom:var(--s4)}
.sheet-foot{display:flex;gap:var(--s2);align-items:center;margin-top:var(--s4)}
.sheet-foot .del{margin-inline-start:auto;font-size:11px;color:var(--danger)}
.sheet-foot .del:hover{text-decoration:underline;text-underline-offset:3px}
.toast{
  position:fixed;inset-block-end:var(--s5);inset-inline-start:50%;transform:translateX(50%);
  background:var(--ink);color:var(--surface);padding:var(--s2) var(--s4);
  border-radius:var(--r);font-size:12px;z-index:120;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ─── التكيّف ─── */
@media (max-width:1000px){
  .dash{grid-template-columns:1fr;gap:0}
  .stats{grid-template-columns:repeat(2,1fr)}
  .canvas{padding:var(--s5) var(--s5) 80px}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .app{grid-template-columns:1fr}
  .side{
    position:sticky;top:0;height:auto;flex-direction:row;align-items:center;
    gap:var(--s3);padding:var(--s3) var(--s4);border-inline-start:none;
    border-bottom:1px solid var(--border-subtle);overflow-x:auto;
  }
  .brand small{display:none}
  .nav{margin-top:0;flex-direction:row;gap:2px}
  .nav a{padding:6px var(--s2);white-space:nowrap}
  .nav .n{display:none}
  .side-foot{margin-top:0;padding-top:0;border-top:none;margin-inline-start:auto}
  .side-foot button{display:none}
  .canvas{padding:var(--s4) var(--s4) 64px}
  .grid2,.grid3{grid-template-columns:1fr}
  h2,.h2{font-size:24px}
  .matn{font-size:18px;padding:var(--s4)}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media print{.side,.composer,.pager{display:none}.app{display:block}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#/home">حاشية<small>تدوين المعرفة القانونية</small></a>
    <nav class="nav" id="nav" aria-label="التنقل الرئيسي"></nav>
    <div class="side-foot">
      <div class="saver" id="saver" data-state="idle" role="status" aria-live="polite">
        <span class="pip" aria-hidden="true"></span><span id="saver-text">جاهز</span>
      </div>
      <button type="button" data-action="export">تصدير نسخة احتياطية</button>
      <button type="button" data-action="import">استيراد ملف</button>
    </div>
  </aside>
  <main class="main"><div class="canvas" id="view"></div></main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file-input" accept="application/json,.json" hidden>

<script>
/* ══════════════════════════════════════════════════════════════════
   حاشية — تدوين المعرفة القانونية الشخصية
   ------------------------------------------------------------------
   المركز هو التشريع. المستخدم يستعرض النظام مادةً مادة، ويكتب عند كل
   مادة حاشية تُربط بها تلقائياً. المواضيع تُكتب داخل النص بعلامة #
   وتُشتق منه، فلا يوجد مصدران للحقيقة.

   البنية:
     Store   التخزين المحلي والحفظ التلقائي
     Model   قراءة البيانات واشتقاقها (مواضيع، ترتيب، عدّادات)
     Router  التوجيه عبر hash
     Views   صفحات: الرئيسية · الحواشي · التشريعات · تشريع · مادة
     Corpus  نصوص التشريعات المرفقة التي تُدرَج عند أول تشغيل
     Editor  نوافذ إضافة وتحرير التشريعات والمواد
     Compose المحرِّر مع الإكمال التلقائي للمواضيع
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const App = (() => {

/* ═══════════ ثوابت ═══════════ */

/** أنواع الحواشي — ثلاثة فقط في هذه المرحلة. */
const NOTE_TYPES = Object.freeze({
  sharh:  'شرح',
  tatbiq: 'تطبيق',
  sual:   'سؤال',
});

/** أنواع الأدوات التشريعية. */
const LAW_KINDS = Object.freeze([
  'نظام', 'لائحة تنفيذية', 'قرار', 'تعميم', 'قواعد', 'دليل',
]);

/** حالات سريان التشريع. */
const LAW_STATUS = Object.freeze(['ساري', 'معدّل', 'ملغى']);

/** الحد الأدنى لطول الحاشية — يمنع الحواشي الفارغة. */
const MIN_NOTE_LENGTH = 5;

/** مهلة تأجيل الحفظ التلقائي بالمللي ثانية. */
const SAVE_DEBOUNCE_MS = 400;

/** مفتاح التخزين. الرقم يتغير عند أي تغيير غير متوافق في البنية. */
const STORAGE_KEY = 'hashiya.store.v4';

/** يطابق موضوعاً داخل نص الحاشية: # يليه حروف أو أرقام أو شرطة. */
const TOPIC_PATTERN = /#([\p{L}\p{N}_-]+)/gu;

/** يطابق إشارة إلى مادة: @ يليه رقمها. تُحلّ داخل تشريع الحاشية نفسه. */
const MENTION_PATTERN = /@([٠-٩0-9]+)/gu;

/** مرور واحد على نص الحاشية يمسك المواضيع والإشارات معاً. */
const BODY_PATTERN = new RegExp(
  TOPIC_PATTERN.source + '|' + MENTION_PATTERN.source, 'gu');


/* ═══════════ أدوات عامة ═══════════ */

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/** تهريب HTML. كل نص من المستخدم يمرّ من هنا قبل الإدراج. */
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[ch]);
}

/** معرّف فريد قصير مقروء. */
function uid(prefix) {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

/** الموضوع يُخزَّن بشرطة سفلية بدل المسافة ليكون رمزاً واحداً لا يلتبس بالنص. */
const normalizeTopic = raw => canonicalTopic(String(raw).trim().replace(/\s+/g, '_'));

/**
 * الشرطة والشرطة السفلية سواء، فلا يتفرّق الموضوع الواحد على صيغتين
 * حين يكتبه المستخدم مرةً «عقد-العمل» ومرةً «عقد_العمل».
 */
const canonicalTopic = raw => String(raw).replace(/-+/g, '_').replace(/^_+|_+$/g, '');

const displayTopic = topic => String(topic).replace(/_/g, ' ');

/** تاريخ نسبي مختصر. */
function timeAgo(timestamp) {
  const days = Math.floor((Date.now() - timestamp) / 86400000);
  if (days < 1)  return 'اليوم';
  if (days === 1) return 'أمس';
  if (days < 30)  return `قبل ${days} يوماً`;
  const months = Math.floor(days / 30);
  if (months < 12) return `قبل ${months} شهراً`;
  return `قبل ${Math.floor(months / 12)} سنة`;
}

/** ترتيب المواد رقمياً مع دعم الأرقام العربية والهندية. */
const ARABIC_DIGITS = '٠١٢٣٤٥٦٧٨٩';
function articleSortKey(no) {
  const latin = String(no).replace(/[٠-٩]/g, d => ARABIC_DIGITS.indexOf(d));
  const num = parseInt(latin.replace(/[^\d]/g, ''), 10);
  return Number.isFinite(num) ? num : Number.MAX_SAFE_INTEGER;
}

function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { el.hidden = true; }, 2600);
}


/* ═══════════ التواريخ الهجرية ═══════════ */
/* تواريخ الأنظمة السعودية هجرية، و<input type="date"> ميلادي لا غير؛ فالأداة
   هنا ثلاث قوائم (يوم · شهر · سنة) بتقويم أم القرى. التحويل إلى الميلادي
   يأتي من تقويم المتصفح نفسه، فلا جدول ثابت يَبلى مع السنين.
   القيمة تُخزَّن «١٤٤٣-٦-٤»، وما كُتب يدوياً قبل الأداة يُعرض كما هو. */

const HIJRI_MONTHS = Object.freeze([
  'محرم', 'صفر', 'ربيع الأول', 'ربيع الآخر', 'جمادى الأولى', 'جمادى الآخرة',
  'رجب', 'شعبان', 'رمضان', 'شوال', 'ذو القعدة', 'ذو الحجة',
]);

const HIJRI_MIN_YEAR = 1300;
const HIJRI_MAX_YEAR = 1500;
const DAY_MS = 86400000;

/** صيغة القيمة المخزَّنة: سنة-شهر-يوم هجري. */
const HIJRI_VALUE = /^(\d{3,4})-(\d{1,2})-(\d{1,2})$/;

/** صيغة المدة: «+١٨٠d» يوماً أو «+٦m» شهراً من تاريخ النشر. */
const TERM_VALUE = /^\+(\d{1,4})([dm])$/;

const arabicNumber = n => String(n).replace(/\d/g, d => ARABIC_DIGITS[Number(d)]);

const hijriFormatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {
  year: 'numeric', month: 'numeric', day: 'numeric', timeZone: 'UTC',
});

const gregorianFormatter = new Intl.DateTimeFormat('ar-SA-u-ca-gregory', {
  year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC',
});

/** أجزاء التاريخ الهجري لِلحظة ميلادية. */
function hijriPartsOf(ms) {
  const found = {};
  for (const part of hijriFormatter.formatToParts(new Date(ms))) {
    if (part.type !== 'literal') found[part.type] = part.value;
  }
  return { y: parseInt(found.year, 10), m: Number(found.month), d: Number(found.day) };
}

const hijriKey = parts => parts.y * 10000 + parts.m * 100 + parts.d;

/**
 * اللحظة الميلادية التي يبدأ فيها يومٌ هجري معيّن.
 * بحث ثنائي على خط الزمن: التقويم متزايد، فيكفي نصفُ المدى في كل خطوة.
 * يعيد null إن كان التاريخ غير موجود (كـ ٣٠ من شهرٍ تسعةٍ وعشرين يوماً).
 */
function gregorianOfHijri(y, m, d) {
  const target = y * 10000 + m * 100 + d;
  let lo = Date.UTC(1800, 0, 1);
  let hi = Date.UTC(2200, 0, 1);

  while (hi - lo > DAY_MS) {
    const mid = lo + Math.floor((hi - lo) / (2 * DAY_MS)) * DAY_MS;
    if (mid <= lo) break;
    if (hijriKey(hijriPartsOf(mid)) < target) lo = mid; else hi = mid;
  }
  return hijriKey(hijriPartsOf(hi)) === target ? hi : null;
}

/** عدد أيام شهر هجري — يتراوح بين ٢٩ و٣٠ في تقويم أم القرى. */
function hijriMonthLength(y, m) {
  const start = gregorianOfHijri(y, m, 1);
  const next = gregorianOfHijri(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1, 1);
  if (start === null || next === null) return 30;
  return Math.round((next - start) / DAY_MS);
}

function parseHijri(value) {
  const found = HIJRI_VALUE.exec(String(value ?? '').trim());
  if (!found) return null;
  const parts = { y: Number(found[1]), m: Number(found[2]), d: Number(found[3]) };
  const valid = parts.y >= HIJRI_MIN_YEAR && parts.y <= HIJRI_MAX_YEAR
    && parts.m >= 1 && parts.m <= 12
    && parts.d >= 1 && parts.d <= hijriMonthLength(parts.y, parts.m);
  return valid ? parts : null;
}

const hijriLabel = parts =>
  `${arabicNumber(parts.d)} ${HIJRI_MONTHS[parts.m - 1]} ${arabicNumber(parts.y)}هـ`;

/** التاريخ الهجري مع مقابله الميلادي. غير المفهوم يُعاد كما هو. */
function formatHijri(value) {
  const parts = parseHijri(value);
  if (!parts) return String(value ?? '').trim();

  const ms = gregorianOfHijri(parts.y, parts.m, parts.d);
  if (ms === null) return hijriLabel(parts);
  return `${hijriLabel(parts)} — الموافق ${gregorianFormatter.format(new Date(ms))}م`;
}

/** يضيف مدةً إلى تاريخ هجري ويعيد أجزاء الناتج. */
function addTerm(parts, amount, unit) {
  if (unit === 'm') {
    const months = (parts.y * 12 + parts.m - 1) + amount;
    const y = Math.floor(months / 12);
    const m = (months % 12) + 1;
    return { y, m, d: Math.min(parts.d, hijriMonthLength(y, m)) };
  }
  const start = gregorianOfHijri(parts.y, parts.m, parts.d);
  return start === null ? null : hijriPartsOf(start + amount * DAY_MS);
}

/**
 * تاريخ السريان: إما تاريخ محدد، وإما مدة من تاريخ النشر — وكثير من
 * الأنظمة تنص على المدة لا على التاريخ، فتُحسب هنا من تاريخ النشر إن عُرف.
 */
function formatEffective(law) {
  const term = TERM_VALUE.exec(String(law.effectiveAt ?? '').trim());
  if (!term) return formatHijri(law.effectiveAt);

  const amount = Number(term[1]);
  const unit = term[2] === 'm' ? (amount === 1 ? 'شهر' : 'شهراً') : (amount === 1 ? 'يوم' : 'يوماً');
  const label = `بعد (${arabicNumber(amount)}) ${unit} من تاريخ النشر`;

  const published = parseHijri(law.publishedAt);
  if (!published) return label;
  const reached = addTerm(published, amount, term[2]);
  return reached ? `${label} — أي ${hijriLabel(reached)}` : label;
}


/* ═══════════ التخزين والحفظ التلقائي ═══════════ */

const Store = (() => {
  /** دفتر فارغ عند أول تشغيل — لا بيانات تجريبية. */
  const seed = () => ({
    schema: 4,
    laws: [],
    articles: [],
    notes: [],
    dropped: [],   // معرّفات التشريعات المرفقة التي حذفها المستخدم
  });

  let data;
  let saveTimer = null;
  let isDirty = false;

  /** تحميل البيانات مع التحقق من سلامة الشكل. */
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (isValidShape(parsed)) return parsed;
        console.warn('حاشية: بنية مخزَّنة غير صالحة — استُخدمت البنية الابتدائية.');
      }
    } catch (err) {
      console.warn('حاشية: تعذّرت قراءة التخزين المحلي.', err);
    }
    return seed();
  }

  function isValidShape(value) {
    return !!value
      && Array.isArray(value.laws)
      && Array.isArray(value.articles)
      && Array.isArray(value.notes);
  }

  function setSaverState(state, text) {
    const el = $('#saver');
    if (!el) return;
    el.dataset.state = state;
    $('#saver-text').textContent = text;
  }

  /** كل تعديل على البيانات يمرّ من هنا. */
  function commit() {
    isDirty = true;
    setSaverState('busy', 'يُحفظ…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, SAVE_DEBOUNCE_MS);
  }

  /** كتابة فورية إلى التخزين المحلي. */
  function flush() {
    if (!isDirty) return;
    clearTimeout(saveTimer);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      isDirty = false;
      const time = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
      setSaverState('done', 'حُفظ ' + time);
    } catch (err) {
      setSaverState('error', 'تعذّر الحفظ — المساحة ممتلئة');
      console.error('حاشية: فشل الحفظ.', err);
    }
  }

  /**
   * إدراج نصوص التشريعات المرفقة في الدفتر.
   * تُدرَج بمعرّفات ثابتة، فلا تتكرر عند كل تشغيل ولا تنفصل عنها الحواشي.
   * ما حرّره المستخدم يبقى كما هو، وما حذفه لا يُعاد.
   */
  function installBundled(bundles) {
    const dropped = new Set(data.dropped || []);
    let added = 0;

    for (const bundle of bundles) {
      const lawId = bundle.law.id;
      if (dropped.has(lawId)) continue;

      const existing = data.laws.find(l => l.id === lawId);
      if (!existing) {
        data.laws.push({ ...bundle.law, bundled: true });
        added++;
      } else {
        // قيمة مرفقة قديمة حلّ محلها شكل أدق — تُصحَّح ما لم يكن المستخدم غيّرها.
        for (const [field, stale] of Object.entries(bundle.superseded || {})) {
          if (stale.includes(existing[field])) { existing[field] = bundle.law[field]; added++; }
        }
      }
      const present = new Set(data.articles.filter(a => a.lawId === lawId).map(a => a.id));
      for (const [id, no, part, chapter, branch, text] of bundle.articles) {
        if (present.has(id)) continue;
        data.articles.push({ id, lawId, no, title: '', part, chapter, branch, text });
        added++;
      }
    }

    if (added) { commit(); flush(); }
  }

  /** يمنع عودة تشريع مرفق حذفه المستخدم. */
  function markDropped(lawId) {
    data.dropped = [...new Set([...(data.dropped || []), lawId])];
  }

  function replaceAll(next) {
    if (!isValidShape(next)) throw new Error('بنية الملف غير صالحة');
    data = next;
    commit();
    flush();
  }

  data = load();

  // ضمان عدم ضياع تعديل عند إغلاق التبويب أو إخفائه.
  window.addEventListener('beforeunload', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

  return {
    get data() { return data; },
    commit, flush, replaceAll, setSaverState, installBundled, markDropped,
  };
})();


/* ═══════════ طبقة القراءة والاشتقاق ═══════════ */

const Model = {
  law:     id => Store.data.laws.find(l => l.id === id) || null,
  article: id => (id ? Store.data.articles.find(a => a.id === id) : null) || null,
  note:    id => Store.data.notes.find(n => n.id === id) || null,

  /** مواد تشريع معيّن مرتَّبة رقمياً. */
  articlesOfLaw(lawId) {
    return Store.data.articles
      .filter(a => a.lawId === lawId)
      .sort((a, b) => articleSortKey(a.no) - articleSortKey(b.no));
  },

  /** حواشي مادة معيّنة، الأحدث أولاً. */
  notesOfArticle(articleId) {
    return Store.data.notes
      .filter(n => n.articleId === articleId)
      .sort((a, b) => b.createdAt - a.createdAt);
  },

  /** حواشٍ مرتبطة بالتشريع كلّه لا بمادةٍ منه — تُكتب حرّةً ثم تُنسب إليه. */
  looseNotesOfLaw(lawId) {
    return Store.data.notes
      .filter(n => !n.articleId && n.lawId === lawId)
      .sort((a, b) => b.createdAt - a.createdAt);
  },

  notesCountOfLaw(lawId) {
    const ids = new Set(this.articlesOfLaw(lawId).map(a => a.id));
    return Store.data.notes.filter(n =>
      (n.articleId && ids.has(n.articleId)) || (!n.articleId && n.lawId === lawId)).length;
  },

  /** المواد التي تشير إليها الحاشية بعلامة @، محلولةً داخل تشريعها. */
  mentionsOf(note) {
    const law = this.lawOfNote(note);
    if (!law) return [];
    const out = [];
    for (const found of String(note.body).matchAll(MENTION_PATTERN)) {
      const target = this.articleByNo(law.id, found[1]);
      if (target && target.id !== note.articleId && !out.includes(target.id)) out.push(target.id);
    }
    return out;
  },

  /** ظهر الروابط: حواشٍ من مواضع أخرى تشير إلى هذه المادة. */
  notesMentioning(articleId) {
    return Store.data.notes
      .filter(n => n.articleId !== articleId && this.mentionsOf(n).includes(articleId))
      .sort((a, b) => b.createdAt - a.createdAt);
  },

  /** عدد الإشارات لكل مادة في مرورٍ واحد — أرخص من سؤال كل مادة على حدة. */
  mentionCounts() {
    const counts = new Map();
    for (const note of Store.data.notes) {
      for (const id of this.mentionsOf(note)) counts.set(id, (counts.get(id) || 0) + 1);
    }
    return counts;
  },

  /**
   * مواضيع الحاشية: الموضوع الرئيسي — إن اختير — ثم ما كُتب داخل النص بعلامة #.
   * الرئيسي حقلٌ مستقل لأن الحاشية الحرة لا مادة تحملها، فالموضوع هو موضعها.
   */
  topicsOf(note) {
    const inline = [...String(note.body).matchAll(TOPIC_PATTERN)].map(m => canonicalTopic(m[1]));
    return [...new Set([this.mainTopicOf(note), ...inline].filter(Boolean))];
  },

  mainTopicOf: note => canonicalTopic(String(note.topic || '').trim()),

  /** مادة برقمها داخل تشريع معيّن — تُستعمل لحلّ الإشارات بعلامة @. */
  articleByNo(lawId, no) {
    const key = articleSortKey(no);
    if (key === Number.MAX_SAFE_INTEGER) return null;
    return Store.data.articles
      .find(a => a.lawId === lawId && articleSortKey(a.no) === key) || null;
  },

  /**
   * التشريع الذي تنتمي إليه الحاشية: عبر مادتها إن كانت تبدأ من مادة،
   * وإلا عبر التشريع الذي نُسبت إليه. وقد لا يكون لها تشريع أصلاً.
   */
  lawOfNote(note) {
    const article = this.article(note.articleId);
    if (article) return this.law(article.lawId);
    return note.lawId ? this.law(note.lawId) : null;
  },

  /** المصادر المستعملة في الحواشي مع عدد مرّاتها — تُشتق ولا تُخزَّن في قائمة. */
  allSources() {
    const counts = new Map();
    for (const note of Store.data.notes) {
      const source = String(note.source || '').trim();
      if (source) counts.set(source, (counts.get(source) || 0) + 1);
    }
    return [...counts.entries()]
      .map(([source, count]) => ({ source, count }))
      .sort((a, b) => b.count - a.count || a.source.localeCompare(b.source, 'ar'));
  },

  /** كل المواضيع مع عدد استعمالاتها، مرتَّبة تنازلياً. */
  allTopics() {
    const counts = new Map();
    for (const note of Store.data.notes) {
      for (const topic of this.topicsOf(note)) {
        counts.set(topic, (counts.get(topic) || 0) + 1);
      }
    }
    return [...counts.entries()]
      .map(([topic, count]) => ({ topic, count }))
      .sort((a, b) => b.count - a.count || a.topic.localeCompare(b.topic, 'ar'));
  },

  /** المادة السابقة والتالية داخل التشريع نفسه. */
  neighbors(article) {
    const list = this.articlesOfLaw(article.lawId);
    const index = list.findIndex(a => a.id === article.id);
    return {
      index,
      total: list.length,
      prev: index > 0 ? list[index - 1] : null,
      next: index >= 0 && index < list.length - 1 ? list[index + 1] : null,
    };
  },
};


/* ═══════════ التوجيه ═══════════ */

const NAV_ITEMS = [
  { key: 'home',  label: 'الرئيسية',  icon: '◈' },
  { key: 'notes', label: 'الحواشي',   icon: '❝', count: () => Store.data.notes.length },
  { key: 'laws',  label: 'التشريعات', icon: '§', count: () => Store.data.laws.length },
];

const Router = (() => {
  let current = { view: 'home', id: null };

  function parse() {
    const raw = location.hash.replace(/^#\/?/, '');
    if (!raw) return { view: 'home', id: null };
    const [view, id = null] = raw.split('/');
    return Views[view] ? { view, id } : { view: 'home', id: null };
  }

  function go(view, id) {
    const target = '#/' + view + (id ? '/' + id : '');
    if (location.hash === target) { render(); return; }
    location.hash = target;
  }

  function handleChange() {
    current = parse();
    State.editingNoteId = null;   // لا يُحمل تحرير حاشية عبر التنقل
    State.composing = false;
    render();
    window.scrollTo({ top: 0 });
  }

  return {
    get current() { return current; },
    go,
    start() {
      window.addEventListener('hashchange', handleChange);
      current = parse();
    },
  };
})();

function renderNav() {
  $('#nav').innerHTML = NAV_ITEMS.map(item => `
    <a href="#/${item.key}" ${Router.current.view === item.key ? 'aria-current="page"' : ''}>
      <span class="ico" aria-hidden="true">${item.icon}</span>
      <span>${item.label}</span>
      ${item.count ? `<span class="n">${item.count()}</span>` : ''}
    </a>`).join('');
}


/* ═══════════ مكوّنات مشتركة ═══════════ */

/**
 * يحوّل نص الحاشية إلى HTML آمن: المواضيع تُصبح مرشِّحات، والإشارات بعلامة @
 * تُصبح روابط إلى موادها. الإشارة التي لا تُحلّ تبقى نصاً كما كتبها المستخدم.
 */
function renderNoteBody(note) {
  const law = Model.lawOfNote(note);
  return esc(note.body).replace(BODY_PATTERN, (match, topic, articleNo) => {
    if (topic !== undefined) {
      const canonical = canonicalTopic(topic);
      if (!canonical) return match;
      return `<button type="button" class="tag-inline" data-action="filter-topic" data-topic="${esc(canonical)}">#${esc(displayTopic(canonical))}</button>`;
    }
    const target = law ? Model.articleByNo(law.id, articleNo) : null;
    if (!target) return match;
    return `<button type="button" class="mention" data-action="open-article" data-id="${esc(target.id)}">المادة ${esc(target.no)}</button>`;
  });
}

/**
 * موضع الحاشية في الدفتر: مادتها إن بدأت من مادة، وإلا التشريع المنسوبة
 * إليه، وإلا أثر ما حُذف. الحاشية التي لا شيء من ذلك لها حاشية حرة.
 */
function noteOrigin(note, options) {
  const article = Model.article(note.articleId);
  if (article) {
    if (!options.showArticle) return '';
    const law = Model.law(article.lawId);
    return `<button type="button" class="link" data-action="open-article" data-id="${esc(article.id)}">
      ${esc(law ? law.title : '')} · المادة ${esc(article.no)}</button>`;
  }
  if (note.orphan) {
    const { lawTitle, articleNo } = note.orphan;
    const trace = [lawTitle, articleNo ? 'المادة ' + articleNo : ''].filter(Boolean).join(' · ');
    return `<span class="ghosted"><s>${esc(trace)}</s> — حُذف</span>`;
  }
  const law = note.lawId ? Model.law(note.lawId) : null;
  if (law) {
    return `<button type="button" class="link" data-action="open-law" data-id="${esc(law.id)}">
      ${esc(law.title)}</button>`;
  }
  return '<span class="free">حاشية حرة</span>';
}

/**
 * بطاقة حاشية. تنقلب محرِّراً في مكانها متى كانت هي المحرَّرة، فلا يُنقل
 * المستخدم إلى صفحة أخرى ليعدّل سطراً.
 * @param {object} note
 * @param {{showArticle?: boolean}} options
 */
function NoteCard(note, options = {}) {
  if (State.editingNoteId === note.id) {
    return `<div class="compose-block">${Compose.template(note.articleId || null, note)}</div>`;
  }

  const main = Model.mainTopicOf(note);
  const rest = Model.topicsOf(note).filter(t => t !== main);
  const origin = noteOrigin(note, options);

  return `
  <article class="card note" data-type="${esc(note.type)}">
    <div class="card-meta">
      <span class="tlabel">${esc(NOTE_TYPES[note.type] || note.type)}</span>
      <span class="dot" aria-hidden="true"></span>
      ${origin ? origin + '<span class="dot" aria-hidden="true"></span>' : ''}
      <span>${timeAgo(note.createdAt)}</span>
      ${note.updatedAt > note.createdAt ? '<span class="dot" aria-hidden="true"></span><span>مُعدَّلة</span>' : ''}
      ${note.source ? `<span class="dot" aria-hidden="true"></span>
        <span class="src">${esc(note.source)}</span>` : ''}
      <span class="spacer"></span>
      <button type="button" class="btn ghost sm" data-action="edit-note" data-id="${esc(note.id)}">تحرير</button>
    </div>
    ${main ? `<button type="button" class="topic-head" data-action="filter-topic"
      data-topic="${esc(main)}">${esc(displayTopic(main))}</button>` : ''}
    <div class="note-body">${renderNoteBody(note)}</div>
    ${rest.length ? `<div class="topics">${rest.map(t =>
      `<button type="button" class="topic" data-action="filter-topic" data-topic="${esc(t)}">${esc(displayTopic(t))}</button>`
    ).join('')}</div>` : ''}
  </article>`;
}

function EmptyState(title, message, action) {
  return `<div class="empty">
    <div class="h2">${esc(title)}</div>
    <p>${esc(message)}</p>
    ${action ? `<button type="button" class="btn" data-action="${esc(action.action)}">${esc(action.label)}</button>` : ''}
  </div>`;
}


/* ═══════════ المحرِّر: مربع إضافة الحاشية ═══════════ */
/* مربع بسيط: نص + نوع + مصدر + زر حفظ. الموضوع يُكتب داخل النص بعلامة #،
   والإشارة إلى مادة أخرى بعلامة @، ولكلٍّ منهما قائمة اقتراحات تمنع التكرار
   والخطأ في الرقم. */

const Compose = (() => {
  let acItems = [];      // عناصر القائمة المعروضة حالياً
  let acIndex = 0;       // العنصر المحدَّد
  let acStart = -1;      // موضع # أو @ في النص
  let acKind  = 'topic'; // نوع الاقتراح: موضوع أو إشارة إلى مادة
  let acOpen  = false;
  let acList  = null;    // قائمة المحرِّر النشط — قد يكون في الصفحة أكثر من محرِّر

  /**
   * قائمة اختيار من قيمٍ سابقة مع بابٍ لقيمة جديدة.
   * القائمة مشتقة من الحواشي نفسها، فلا يوجد سجل منفصل يتعارض معها.
   */
  function pickControl(cls, options, current, words, show = String) {
    const known = current && !options.includes(current) ? [current, ...options] : options;
    return `
      <span class="pick">
        <select class="${cls}" aria-label="${esc(words.label)}">
          <option value="">${esc(words.none)}</option>
          ${known.map(value => `<option value="${esc(value)}" ${current === value ? 'selected' : ''}>
            ${esc(show(value))}</option>`).join('')}
          <option value="" data-new="yes">${esc(words.add)}</option>
        </select>
        <input class="pick-new src-new" placeholder="${esc(words.hint)}" hidden
          aria-label="${esc(words.hint)}">
      </span>`;
  }

  const sourceControl = note => pickControl(
    'note-source',
    Model.allSources().map(s => s.source),
    String(note?.source || '').trim(),
    { label: 'مصدر الحاشية', none: 'بلا مصدر', add: '+ إضافة مصدر…', hint: 'اسم المصدر' });

  /** الموضوع الرئيسي — موضع الحاشية حين لا تحملها مادة. */
  const topicControl = note => pickControl(
    'note-topic',
    Model.allTopics().map(t => t.topic),
    note ? Model.mainTopicOf(note) : '',
    { label: 'الموضوع الرئيسي', none: 'بلا موضوع رئيسي',
      add: '+ موضوع رئيسي جديد…', hint: 'اسم الموضوع' },
    topic => '#' + displayTopic(topic));

  /** الحاشية الحرة تُنسب إلى تشريع اختياراً، وبه تُحلّ إشاراتها بعلامة @. */
  function lawControl(lawId) {
    const { laws } = Store.data;
    if (!laws.length) return '';
    return `
      <select class="note-law" aria-label="التشريع المنسوبة إليه">
        <option value="">بلا تشريع</option>
        ${laws.map(law => `<option value="${esc(law.id)}" ${lawId === law.id ? 'selected' : ''}>
          ${esc(law.title)}</option>`).join('')}
      </select>`;
  }

  /**
   * @param {?string} articleId المادة التي تبدأ منها الحاشية، أو null لحاشية حرة.
   * @param {?object} note الحاشية المحرَّرة، أو null لحاشية جديدة.
   */
  function template(articleId, note) {
    const isEdit = !!note;
    const free = !articleId;
    const lawId = free ? String(note?.lawId || '') : '';

    return `
    <div class="composer" data-composer data-article="${esc(articleId || '')}"
      ${isEdit ? `data-note="${esc(note.id)}"` : ''}>
      <div class="composer-wrap">
        <textarea class="note-input" rows="3" aria-label="نص الحاشية" aria-autocomplete="list"
          placeholder="${free
            ? 'اكتب ملاحظتك… # لموضوع، @ للإشارة إلى مادة'
            : 'اكتب حاشيتك على هذه المادة… # لموضوع، @ للإشارة إلى مادة'}">${esc(note ? note.body : '')}</textarea>
        <ul class="ac" role="listbox" hidden></ul>
      </div>
      <div class="composer-foot">
        <select class="note-type" aria-label="نوع الحاشية">
          ${Object.entries(NOTE_TYPES).map(([value, label]) =>
            `<option value="${value}" ${note && note.type === value ? 'selected' : ''}>${label}</option>`).join('')}
        </select>
        ${topicControl(note)}
        ${free ? lawControl(lawId) : ''}
        ${sourceControl(note)}
        <button type="button" class="btn" data-action="save-note">${isEdit ? 'احفظ التعديل' : 'أضف الحاشية'}</button>
        ${isEdit ? `
          <button type="button" class="btn ghost" data-action="cancel-edit">إلغاء</button>
          <button type="button" class="btn ghost sm danger" data-action="delete-note" data-id="${esc(note.id)}">حذف</button>`
        : `<span class="composer-hint">${free
            ? 'اربطها بموضوع رئيسي، أو أشِر إلى مادة بعلامة @'
            : 'تُربط تلقائياً بهذه المادة'}</span>`}
      </div>
    </div>`;
  }

  /** يقرأ المقطع الذي يلي # أو @ عند مؤشر الكتابة، إن وُجد. */
  function activeToken(textarea) {
    const caret = textarea.selectionStart;
    const before = textarea.value.slice(0, caret);
    const hash = before.lastIndexOf('#');
    const at   = before.lastIndexOf('@');
    const start = Math.max(hash, at);
    if (start === -1) return null;

    const query = before.slice(start + 1);
    // يُلغى الاقتراح إذا احتوى المقطع على مسافة أو سطر جديد.
    if (/[\s\n]/.test(query)) return null;
    // يجب أن تسبق العلامة مسافة أو بداية النص، لا حرف.
    const charBefore = start > 0 ? before[start - 1] : ' ';
    if (!/[\s\n(«"]/.test(charBefore)) return null;

    return { kind: start === at ? 'mention' : 'topic', start, query };
  }

  function closeAutocomplete() {
    if (acList) { acList.hidden = true; acList.innerHTML = ''; }
    acList = null;
    acOpen = false;
    acItems = [];
    acIndex = 0;
    acStart = -1;
    acKind = 'topic';
  }

  function openAutocomplete(textarea) {
    const token = activeToken(textarea);
    const list = textarea.closest('[data-composer]')?.querySelector('.ac');
    if (!token || !list) { closeAutocomplete(); return; }

    const items = token.kind === 'mention'
      ? mentionItems(textarea, token.query)
      : topicItems(token.query);
    if (!items.length) { closeAutocomplete(); return; }

    if (acList && acList !== list) closeAutocomplete();
    acList = list;
    acItems = items;
    acKind = token.kind;
    acStart = token.start;
    acIndex = 0;
    acOpen = true;
    paint();
  }

  function topicItems(rawQuery) {
    const query = rawQuery.toLowerCase();
    const existing = Model.allTopics()
      .filter(t => !query || t.topic.toLowerCase().includes(query))
      .slice(0, 8);

    const normalized = normalizeTopic(rawQuery);
    const isNew = normalized && !existing.some(t => t.topic === normalized);

    const items = existing.map(t => ({ topic: t.topic, count: t.count, isNew: false }));
    if (isNew) items.push({ topic: normalized, count: 0, isNew: true });
    return items;
  }

  /** التشريع الذي تُحلّ فيه الإشارات: تشريع المادة، أو المختار للحاشية الحرة. */
  function scopeOf(composer) {
    const here = Model.article(composer.dataset.article);
    if (here) return { lawId: here.lawId, here };
    return { lawId: composer.querySelector('.note-law')?.value || '', here: null };
  }

  /**
   * مواد التشريع نفسه، مرشَّحة برقم المادة أو بكلمة من نصها.
   * وحين لا تشريع للحاشية الحرة بعد، تُعرض مواد التشريعات كلها معنونةً بها،
   * فأول اختيار هو الذي ينسب الحاشية إلى تشريعه.
   */
  function mentionItems(textarea, rawQuery) {
    const composer = textarea.closest('[data-composer]');
    if (!composer) return [];
    const { lawId, here } = scopeOf(composer);

    const pool = lawId
      ? Model.articlesOfLaw(lawId)
      : Store.data.laws.flatMap(law => Model.articlesOfLaw(law.id));
    if (!pool.length) return [];

    const query = rawQuery.trim();
    // الرقم يُطابق أرقام المواد وحدها، وإلا طابَق أرقام البنود داخل النصوص.
    const isNumber = /^[٠-٩0-9]+$/.test(query);
    const prefix = isNumber ? String(articleSortKey(query)) : '';

    return pool
      .filter(a => !here || a.id !== here.id)
      .filter(a => {
        if (!query) return true;
        if (isNumber) return String(articleSortKey(a.no)).startsWith(prefix);
        return a.text.includes(query) || String(a.title || '').includes(query);
      })
      .slice(0, 8)
      .map(a => {
        const law = lawId ? null : Model.law(a.lawId);
        const body = (a.title || a.text).slice(0, 44);
        return { no: a.no, lawId: a.lawId, hint: law ? `${law.title} · ${body}` : body };
      });
  }

  function paint() {
    if (!acList) return;
    acList.innerHTML = acItems.map((item, i) => `
      <li role="option" data-i="${i}" aria-selected="${i === acIndex}">
        ${acKind === 'mention'
          ? `<span>المادة ${esc(item.no)}</span><span class="n">${esc(item.hint)}</span>`
          : `<span>#${esc(displayTopic(item.topic))}</span>${item.isNew
              ? '<span class="new n">موضوع جديد</span>'
              : `<span class="n">${item.count}</span>`}`}
      </li>`).join('');
    acList.hidden = false;
    const active = acList.querySelector('[aria-selected="true"]');
    if (active) active.scrollIntoView({ block: 'nearest' });
  }

  /** أول إشارةٍ في حاشية حرة تنسبها إلى تشريع المادة المختارة. */
  function bindLaw(composer, lawId) {
    const select = composer.querySelector('.note-law');
    if (select && !select.value && lawId) select.value = lawId;
  }

  /** يستبدل المقطع الجاري كتابته بالموضوع أو الإشارة المختارة. */
  function accept(textarea, index) {
    const item = acItems[index];
    if (!item || acStart < 0) return;
    if (acKind === 'mention') bindLaw(textarea.closest('[data-composer]'), item.lawId);

    const caret = textarea.selectionStart;
    const inserted = acKind === 'mention' ? '@' + item.no + ' ' : '#' + item.topic + ' ';
    textarea.value = textarea.value.slice(0, acStart) + inserted + textarea.value.slice(caret);
    const pos = acStart + inserted.length;
    textarea.setSelectionRange(pos, pos);
    closeAutocomplete();
    textarea.focus();
  }

  /** لوحة المفاتيح داخل مربع الكتابة. */
  function onKeyDown(event, textarea) {
    if (acOpen) {
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        acIndex = (acIndex + 1) % acItems.length;
        paint(); return;
      }
      if (event.key === 'ArrowUp') {
        event.preventDefault();
        acIndex = (acIndex - 1 + acItems.length) % acItems.length;
        paint(); return;
      }
      if (event.key === 'Enter' || event.key === 'Tab') {
        event.preventDefault();
        accept(textarea, acIndex); return;
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        closeAutocomplete(); return;
      }
    }
    // اختصار الحفظ.
    if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
      event.preventDefault();
      const composer = textarea.closest('[data-composer]');
      composer?.querySelector('[data-action="save-note"]')?.click();
    }
  }

  /** خيار «إضافة» يُعرَف بسمته، فلا نحتاج قيمةً سحرية قد تكون اسم مصدر. */
  const wantsNew = select => select.selectedOptions[0]?.dataset.new === 'yes';

  /** القيمة المختارة من القائمة، أو ما كُتب في حقل القيمة الجديدة. */
  function readPick(composer, cls) {
    const select = composer.querySelector('.' + cls);
    if (!select) return '';
    if (!wantsNew(select)) return select.value.trim();
    return (select.closest('.pick')?.querySelector('.pick-new')?.value || '').trim();
  }

  /** إظهار حقل الكتابة عند اختيار «إضافة». */
  function onPickChange(select) {
    const field = select.closest('.pick')?.querySelector('.pick-new');
    if (!field) return;
    field.hidden = !wantsNew(select);
    if (!field.hidden) field.focus();
  }

  function save(composer) {
    const textarea = composer.querySelector('textarea');
    const body = textarea.value.trim();
    if (body.length < MIN_NOTE_LENGTH) {
      toast('اكتب حاشية أطول قليلاً');
      textarea.focus();
      return;
    }
    const articleId = composer.dataset.article || null;
    const type = composer.querySelector('.note-type').value;
    const source = readPick(composer, 'note-source');
    const topic = normalizeTopic(readPick(composer, 'note-topic'));
    const lawId = articleId ? null : (composer.querySelector('.note-law')?.value || null);
    const editingId = composer.dataset.note;

    if (editingId) {
      const note = Model.note(editingId);
      if (!note) { toast('لم تُعثر الحاشية'); return; }
      note.body = body;
      note.type = type;
      note.source = source;
      note.topic = topic;
      note.updatedAt = Date.now();
      if (!articleId) note.lawId = lawId;
      State.editingNoteId = null;
      toast('حُفظ التعديل');
    } else {
      Store.data.notes.unshift({
        id: uid('note'),
        articleId,
        lawId,
        type,
        source,
        topic,
        body,
        createdAt: Date.now(),
        updatedAt: Date.now(),
      });
      State.composing = false;
      toast('أُضيفت الحاشية');
    }
    Store.commit();
    closeAutocomplete();
    render();
  }

  return { template, openAutocomplete, closeAutocomplete, onKeyDown, accept, save, onPickChange,
           get isOpen() { return acOpen; },
           acceptAt(textarea, i) { accept(textarea, i); } };
})();

              ${esc(displayTopic(t.topic))} · ${t.count}
            </button>`).join('')}</div>`
            : '<p class="lede">اكتب # داخل أي حاشية لإنشاء موضوع.</p>'}
        </div>
      </aside>
    </div>`;
  },

  /* ─── الحواشي ─── */
  notes() {
    const query = State.query.trim();
    let list = Store.data.notes.slice().sort((a, b) => b.createdAt - a.createdAt);

    if (State.noteTypeFilter !== 'all') list = list.filter(n => n.type === State.noteTypeFilter);
    if (State.topicFilter) list = list.filter(n => Model.topicsOf(n).includes(State.topicFilter));
    if (query) list = list.filter(n => n.body.includes(query));

    const counts = {};
    for (const n of Store.data.notes) counts[n.type] = (counts[n.type] || 0) + 1;
    const topics = Model.allTopics();

    return `
    <div class="phead">
      <div>
        <div class="eyebrow">الحواشي</div>
        <h2>كل ما علّقته</h2>
        <p class="lede">أكثر الحواشي تبدأ من مادة، وبعضها يبدأ من فكرة. اكتبها هنا،
          ثم اربطها بموضوع رئيسي أو أشِر إلى مادة بعلامة @ فتظهر عندها.</p>
      </div>
      <button type="button" class="btn ${State.composing ? 'ghost' : ''}" data-action="toggle-compose">
        ${State.composing ? 'إغلاق المحرِّر' : 'حاشية حرة'}</button>
    </div>

    ${State.composing ? `<div class="compose-block">
      <div class="eyebrow">حاشية لا تبدأ من مادة</div>
      ${Compose.template(null, null)}
    </div>` : ''}

    <div class="field" style="max-width:420px">
      <label for="notes-search">بحث في نصوص الحواشي</label>
      <input id="notes-search" type="search" value="${esc(State.query)}" placeholder="اكتب كلمة…" autocomplete="off">
    </div>

    <div class="chips">
      <button type="button" class="chip ${State.noteTypeFilter === 'all' ? 'on' : ''}"
        data-action="filter-type" data-type="all">الكل (${Store.data.notes.length})</button>
      ${Object.entries(NOTE_TYPES).filter(([k]) => counts[k]).map(([key, label]) => `
        <button type="button" class="chip ${State.noteTypeFilter === key ? 'on' : ''}"
          data-action="filter-type" data-type="${key}">${label} (${counts[key]})</button>`).join('')}
    </div>

    ${topics.length ? `<div class="topics" style="margin:-8px 0 20px">
      ${State.topicFilter ? `<button type="button" class="topic on" data-action="filter-topic" data-topic="${esc(State.topicFilter)}">
        ${esc(displayTopic(State.topicFilter))} ×</button>`
      : topics.slice(0, 12).map(t => `
        <button type="button" class="topic" data-action="filter-topic" data-topic="${esc(t.topic)}">
          ${esc(displayTopic(t.topic))} · ${t.count}</button>`).join('')}
    </div>` : ''}

    ${list.length
      ? list.map(n => NoteCard(n, { showArticle: true })).join('')
      : Store.data.notes.length
        ? EmptyState('لا حواشي مطابقة', 'غيّر المرشِّح أو امسح البحث.')
        : EmptyState('لا حواشي بعد', 'ابدأ من مادة في تشريع، أو اكتب حاشية حرة تربطها بموضوع.',
                     { action: 'toggle-compose', label: 'حاشية حرة' })}`;
  },

  /* ─── قائمة التشريعات ─── */
  laws() {
    const { laws } = Store.data;
    return `
    <div class="phead">
      <div>
        <div class="eyebrow">التشريعات</div>
        <h2>الأنظمة واللوائح</h2>
        <p class="lede">افتح تشريعاً لتستعرض بياناته ومواده، ثم علّق على ما تشاء منها.</p>
      </div>
      <button type="button" class="btn" data-action="new-law">تشريع جديد</button>
    </div>

    ${laws.length ? laws.map(law => {
      const articleCount = Model.articlesOfLaw(law.id).length;
      const noteCount = Model.notesCountOfLaw(law.id);
      return `
      <div class="card">
        <button type="button" class="law-card" data-action="open-law" data-id="${esc(law.id)}">
          <div class="card-meta">
            <span class="tlabel">${esc(law.kind || '—')}</span>
            <span class="dot" aria-hidden="true"></span>
            <span class="status" data-s="${esc(law.status || '')}">${esc(law.status || '—')}</span>
            <span class="dot" aria-hidden="true"></span>
            <span>${esc(law.instrument || '—')}</span>
          </div>
          <div class="law-title">${esc(law.title)}</div>
          ${law.summary ? `<p class="lede">${esc(law.summary)}</p>` : ''}
        </button>
        <div class="topics">
          <span class="topic" style="cursor:default">${articleCount} مادة</span>
          <span class="topic" style="cursor:default">${noteCount} حاشية</span>
          <span class="spacer"></span>
          <button type="button" class="topic" data-action="edit-law" data-id="${esc(law.id)}">تحرير البيانات</button>
          <button type="button" class="topic danger" data-action="delete-law" data-id="${esc(law.id)}">حذف</button>
        </div>
      </div>`;
    }).join('')
    : EmptyState('لا تشريعات بعد', 'أضف أول تشريع، ثم أضف مواده.',
                 { action: 'new-law', label: 'تشريع جديد' })}`;
  },

  /* ─── صفحة تشريع: البيانات ثم المواد ─── */
  law() {
    const law = Model.law(Router.current.id);
    if (!law) return Views.laws();

    const articles = Model.articlesOfLaw(law.id);
    const loose = Model.looseNotesOfLaw(law.id);
    const mentions = Model.mentionCounts();

    // تجميع المواد تحت الباب ثم الفصل ثم الفرع، مع الحفاظ على الترتيب الرقمي.
    const groups = [];
    for (const article of articles) {
      const division = {
        part:    article.part    || '',
        chapter: article.chapter || '',
        branch:  article.branch  || '',
      };
      const key = [division.part, division.chapter, division.branch].join('\u001f');
      const last = groups[groups.length - 1];
      if (last && last.key === key) last.items.push(article);
      else groups.push({ key, ...division, items: [article] });
    }

    // العنوان لا يُكرَّر إلا عند تغيّر مستواه، فتظهر الأبواب والفصول متداخلة.
    let shownPart = null;
    let shownChapter = null;
    const heading = group => {
      const out = [];
      if (group.part && group.part !== shownPart) {
        out.push(`<div class="part">${esc(group.part)}</div>`);
        shownPart = group.part;
        shownChapter = null;
      }
      if (group.chapter && group.chapter !== shownChapter) {
        out.push(`<div class="chapter">${esc(group.chapter)}</div>`);
        shownChapter = group.chapter;
      }
      if (group.branch) out.push(`<div class="branch">${esc(group.branch)}</div>`);
      return out.join('');
    };

    const meta = [
      ['النوع', law.kind],
      ['أداة الإصدار', law.instrument],
      ['تاريخ الإصدار', formatHijri(law.issuedAt)],
      ['النشر', law.gazette],
      ['تاريخ النشر', formatHijri(law.publishedAt)],
      ['تاريخ السريان', formatEffective(law)],
      ['الجهة المختصة', law.authority],
    ].filter(([, value]) => value);

    return `
    <button type="button" class="crumb" data-action="open-laws">← التشريعات</button>
    <div class="phead">
      <div>
        <div class="eyebrow">
          <span class="status" data-s="${esc(law.status || '')}">${esc(law.status || '—')}</span>
        </div>
        <h2>${esc(law.title)}</h2>
        ${law.summary ? `<p class="lede">${esc(law.summary)}</p>` : ''}
      </div>
      <div class="phead-acts">
        <button type="button" class="btn ghost" data-action="edit-law" data-id="${esc(law.id)}">تحرير البيانات</button>
        <button type="button" class="btn ghost danger" data-action="delete-law" data-id="${esc(law.id)}">حذف التشريع</button>
      </div>
    </div>

    ${meta.length ? `<dl class="meta-grid">
      ${meta.map(([term, value]) => `<div><dt>${esc(term)}</dt><dd>${esc(value)}</dd></div>`).join('')}
    </dl>` : ''}

    ${law.preamble ? `<details class="fold">
      <summary>ديباجة الإصدار${law.instrument ? ' — ' + esc(law.instrument) : ''}</summary>
      <div class="matn sm">${esc(law.preamble)}</div>
    </details>` : ''}

    <div class="eyebrow" style="margin-top:28px">
      المواد (${articles.length})
      <button type="button" class="btn sm" data-action="new-article" data-id="${esc(law.id)}"
        style="margin-inline-start:8px">مادة جديدة</button>
    </div>

    ${articles.length ? `<div class="card" style="padding:8px 0">
      ${groups.map(group => `
        ${heading(group)}
        ${group.items.map(article => {
          const count = Model.notesOfArticle(article.id).length + (mentions.get(article.id) || 0);
          return `
          <button type="button" class="art-row" data-action="open-article" data-id="${esc(article.id)}">
            <span class="art-no">${esc(article.no)}</span>
            <span class="art-t">${esc(article.title || article.text.slice(0, 70))}</span>
            <span class="art-n">${count ? count + ' حاشية' : ''}</span>
          </button>`;
        }).join('')}`).join('')}
    </div>`
    : EmptyState('لا مواد بعد', 'أضف مواد هذا التشريع لتتمكن من التعليق عليها.',
                 { action: 'new-article-current', label: 'مادة جديدة' })}

    ${loose.length ? `
      <div class="eyebrow" style="margin-top:32px">حواشٍ على التشريع عامةً (${loose.length})</div>
      ${loose.map(n => NoteCard(n)).join('')}` : ''}`;
  },

  /* ─── صفحة مادة: النص ثم مربع الحاشية ثم الحواشي ─── */
  article() {
    const article = Model.article(Router.current.id);
    if (!article) return Views.laws();

    const law = Model.law(article.lawId);
    const notes = Model.notesOfArticle(article.id);
    const mentioning = Model.notesMentioning(article.id);
    const { prev, next, index, total } = Model.neighbors(article);
    const trail = [article.part, article.chapter, article.branch].filter(Boolean);

    return `
    <button type="button" class="crumb" data-action="open-law" data-id="${esc(article.lawId)}">
      ← ${esc(law ? law.title : 'التشريع')}
    </button>
    <div class="phead">
      <div>
        <div class="eyebrow">${esc(law ? law.title : 'مادة')}</div>
        <h2>المادة ${esc(article.no)}${article.title ? ' — ' + esc(article.title) : ''}</h2>
        ${trail.length ? `<div class="trail">${trail.map(esc).join(' · ')}</div>` : ''}
      </div>
      <button type="button" class="btn ghost" data-action="edit-article" data-id="${esc(article.id)}">تحرير المادة</button>
    </div>

    <div class="matn">${esc(article.text)}</div>

    <nav class="pager" aria-label="تنقل بين المواد">
      <button type="button" class="btn ghost sm" data-action="open-article"
        data-id="${prev ? esc(prev.id) : ''}" ${prev ? '' : 'disabled'}>← المادة السابقة</button>
      <button type="button" class="btn ghost sm" data-action="open-article"
        data-id="${next ? esc(next.id) : ''}" ${next ? '' : 'disabled'}>المادة التالية →</button>
      <span class="pos">${index + 1} من ${total}</span>
    </nav>

    <div class="eyebrow" style="margin-top:32px">أضف حاشية</div>
    ${Compose.template(article.id, null)}

    <div class="eyebrow" style="margin-top:32px">حواشيك على هذه المادة (${notes.length})</div>
    ${notes.length
      ? notes.map(n => NoteCard(n)).join('')
      : EmptyState('لا حواشي على هذه المادة', 'أول حاشية عادةً هي التنبيه العملي الذي تكرر عليك.')}

    ${mentioning.length ? `
      <div class="eyebrow" style="margin-top:32px">حواشٍ تشير إلى هذه المادة (${mentioning.length})</div>
      ${mentioning.map(n => NoteCard(n, { showArticle: true })).join('')}` : ''}`;
  },
};


/* ═══════════ أداة اختيار التاريخ ═══════════ */
/* ثلاث قوائم لا حقل نص: يوم من طول الشهر الفعلي، وشهر بأسمائه، وسنة هجرية.
   سطرٌ تحتها يبيّن ما اختيرَ بالهجري وما يوافقه بالميلادي.
   النص الذي كُتب يدوياً قبل الأداة يبقى محفوظاً حتى يُختار تاريخ يستبدله. */

const DatePick = {
  markup(id, label, value) {
    const picked = parseHijri(value);
    const legacy = picked ? '' : String(value ?? '').trim();
    const length = picked ? hijriMonthLength(picked.y, picked.m) : 30;

    const years = [];
    for (let y = HIJRI_MAX_YEAR; y >= HIJRI_MIN_YEAR; y--) years.push(y);
    const on = test => test ? 'selected' : '';

    return `
    <div class="field" data-date="${esc(id)}">
      <label for="${esc(id)}-d">${esc(label)}</label>
      <div class="datepick">
        <select id="${esc(id)}-d" aria-label="اليوم">
          <option value="" ${on(!picked)}>اليوم</option>
          ${Array.from({ length }, (_, i) => i + 1).map(d =>
            `<option value="${d}" ${on(picked && picked.d === d)}>${arabicNumber(d)}</option>`).join('')}
        </select>
        <select id="${esc(id)}-m" aria-label="الشهر">
          <option value="" ${on(!picked)}>الشهر</option>
          ${HIJRI_MONTHS.map((name, i) =>
            `<option value="${i + 1}" ${on(picked && picked.m === i + 1)}>${esc(name)}</option>`).join('')}
        </select>
        <select id="${esc(id)}-y" aria-label="السنة">
          <option value="" ${on(!picked)}>السنة</option>
          ${years.map(y =>
            `<option value="${y}" ${on(picked && picked.y === y)}>${arabicNumber(y)}هـ</option>`).join('')}
        </select>
        <button type="button" class="btn ghost sm" data-action="clear-date" data-id="${esc(id)}">امسح</button>
      </div>
      <input type="hidden" id="${esc(id)}-raw" value="${esc(legacy)}">
      <p class="datepick-echo" id="${esc(id)}-echo">${esc(this.echo(id, value))}</p>
    </div>`;
  },

  /** القيمة المختارة، أو النص السابق إن لم يكتمل الاختيار. */
  read(id) {
    const day = $('#' + id + '-d')?.value;
    const month = $('#' + id + '-m')?.value;
    const year = $('#' + id + '-y')?.value;
    if (day && month && year) return `${year}-${month}-${day}`;
    return $('#' + id + '-raw')?.value.trim() || '';
  },

  /** السطر المبيِّن. يُقرأ من الحقول عند التغيير، ومن القيمة عند أول رسم. */
  echo(id, initial) {
    const value = initial !== undefined ? String(initial ?? '').trim() : this.read(id);
    if (!value) return 'لم يُحدَّد';
    return parseHijri(value) ? formatHijri(value) : `نصّ مكتوب سابقاً: ${value}`;
  },

  /** طول الشهر يختلف، فتُبنى قائمة الأيام من جديد عند كل تغيير. */
  refresh(id) {
    const year = Number($('#' + id + '-y')?.value);
    const month = Number($('#' + id + '-m')?.value);
    const days = $('#' + id + '-d');

    if (days && year && month) {
      const length = hijriMonthLength(year, month);
      const chosen = Number(days.value);
      days.innerHTML = '<option value="">اليوم</option>'
        + Array.from({ length }, (_, i) => i + 1).map(d =>
            `<option value="${d}" ${d === chosen ? 'selected' : ''}>${arabicNumber(d)}</option>`).join('');
    }
    const echo = $('#' + id + '-echo');
    if (echo) echo.textContent = this.echo(id);
  },

  clear(id) {
    for (const suffix of ['-d', '-m', '-y', '-raw']) {
      const field = $('#' + id + suffix);
      if (field) field.value = '';
    }
    this.refresh(id);
  },

  /**
   * تاريخ السريان يأتي في الأنظمة على وجهين: تاريخاً محدداً، أو مدةً من
   * تاريخ النشر — كنظام الإثبات: «بعد مائة وثمانين يوماً». فالوجهان معاً.
   */
  effective(law) {
    const term = TERM_VALUE.exec(String(law?.effectiveAt ?? '').trim());
    const isTerm = !!term;

    return `
      <div class="field">
        <label for="lf-eff-mode">تاريخ السريان</label>
        <select id="lf-eff-mode" class="narrow">
          <option value="date" ${isTerm ? '' : 'selected'}>تاريخ محدد</option>
          <option value="term" ${isTerm ? 'selected' : ''}>مدة من تاريخ النشر</option>
        </select>
      </div>
      <div data-eff="date" ${isTerm ? 'hidden' : ''}>
        ${this.markup('lf-effective', 'يبدأ السريان في', isTerm ? '' : law?.effectiveAt)}
      </div>
      <div class="field" data-eff="term" ${isTerm ? '' : 'hidden'}>
        <label for="lf-eff-n">يسري بعد</label>
        <div class="datepick">
          <input id="lf-eff-n" type="number" min="1" max="9999"
            value="${term ? esc(term[1]) : '90'}" aria-label="المقدار">
          <select id="lf-eff-u" aria-label="الوحدة">
            <option value="d" ${term && term[2] === 'm' ? '' : 'selected'}>يوماً</option>
            <option value="m" ${term && term[2] === 'm' ? 'selected' : ''}>شهراً</option>
          </select>
          <span class="composer-hint">من تاريخ النشر</span>
        </div>
      </div>`;
  },

  /** قراءة تاريخ السريان على وجهه المختار. */
  readEffective() {
    if ($('#lf-eff-mode')?.value !== 'term') return this.read('lf-effective');
    const amount = Number($('#lf-eff-n').value);
    return amount > 0 ? '+' + amount + $('#lf-eff-u').value : '';
  },
};


/* ═══════════ النوافذ: تحرير التشريعات والمواد ═══════════ */

const Sheet = {
  open(html) {
    $('#sheet').innerHTML = html;
    $('#modal').hidden = false;
    const first = $('#sheet input, #sheet textarea, #sheet select');
    if (first) first.focus();
  },
  close() {
    $('#modal').hidden = true;
    $('#sheet').innerHTML = '';
  },

  law(lawId) {
    const law = lawId ? Model.law(lawId) : null;
    const field = (id, label, value = '', placeholder = '') =>
      `<div class="field"><label for="${id}">${label}</label>
       <input id="${id}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`;

    this.open(`
      <h3>${law ? 'تحرير بيانات التشريع' : 'تشريع جديد'}</h3>
      ${field('lf-title', 'اسم التشريع', law?.title, 'نظام العمل')}
      <div class="grid3">
        <div class="field"><label for="lf-kind">النوع</label>
          <select id="lf-kind">${LAW_KINDS.map(k =>
            `<option value="${esc(k)}" ${law?.kind === k ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></div>
        <div class="field"><label for="lf-status">الحالة</label>
          <select id="lf-status">${LAW_STATUS.map(s =>
            `<option value="${esc(s)}" ${law?.status === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
        ${field('lf-instrument', 'أداة الإصدار', law?.instrument, 'مرسوم ملكي م/٥١')}
      </div>
      ${DatePick.markup('lf-issued', 'تاريخ الإصدار', law?.issuedAt)}
      ${DatePick.markup('lf-published', 'تاريخ النشر', law?.publishedAt)}
      ${DatePick.effective(law)}
      <div class="grid2">
        ${field('lf-gazette', 'جهة النشر والعدد', law?.gazette, 'أم القرى — العدد ٤٠٦٨')}
        ${field('lf-authority', 'الجهة المختصة', law?.authority)}
      </div>
      <div class="field"><label for="lf-summary">ملخص</label>
        <textarea id="lf-summary" rows="2">${esc(law?.summary || '')}</textarea></div>
      <div class="field"><label for="lf-preamble">الديباجة — نص أداة الإصدار</label>
        <textarea id="lf-preamble" rows="5"
          placeholder="بعون الله تعالى، نحن…">${esc(law?.preamble || '')}</textarea></div>
      <div class="sheet-foot">
        <button type="button" class="btn" data-action="save-law" data-id="${esc(lawId || '')}">
          ${law ? 'احفظ' : 'أضف التشريع'}</button>
        <button type="button" class="btn ghost" data-action="close-sheet">إلغاء</button>
        ${law ? `<button type="button" class="del" data-action="delete-law" data-id="${esc(lawId)}">حذف التشريع</button>` : ''}
      </div>`);
  },

  article(articleId, lawId) {
    const article = articleId ? Model.article(articleId) : null;
    const targetLaw = article ? article.lawId : lawId;
    // القيم المستعملة في التشريع نفسه تُعرض كاقتراحات فلا تتفرّق تسميات الأبواب.
    const used = key => [...new Set(Store.data.articles
      .filter(a => a.lawId === targetLaw && a[key])
      .map(a => a[key]))];

    const division = (id, label, key, placeholder) => `
      <div class="field"><label for="${id}">${label}</label>
        <input id="${id}" value="${esc(article?.[key] || '')}" list="${id}-list"
          placeholder="${esc(placeholder)}">
        <datalist id="${id}-list">${used(key).map(v =>
          `<option value="${esc(v)}"></option>`).join('')}</datalist></div>`;

    this.open(`
      <h3>${article ? 'تحرير مادة' : 'مادة جديدة'}</h3>
      <div class="field"><label for="af-law">التشريع</label>
        <select id="af-law">${Store.data.laws.map(l =>
          `<option value="${esc(l.id)}" ${targetLaw === l.id ? 'selected' : ''}>${esc(l.title)}</option>`).join('')}</select></div>
      <div class="grid2">
        <div class="field"><label for="af-no">رقم المادة</label>
